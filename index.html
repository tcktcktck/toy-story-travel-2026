<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Euro 2026 | Mission Control V5.9.4</title>
  
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: { 
        extend: { 
          fontFamily: { sans: ['"Cabinet Grotesk"', 'sans-serif'] },
          colors: { toyBlue: '#2A75B3', toyYellow: '#F1C40F', toyRed: '#E74C3C', toyGreen: '#2ECC71' },
          borderRadius: { 'toy': '2.5rem' },
          keyframes: {
            wiggle: {
              '0%, 100%': { transform: 'rotate(-3deg)' },
              '50%': { transform: 'rotate(3deg)' },
            }
          },
          animation: {
            wiggle: 'wiggle 0.3s ease-in-out 2'
          }
        }
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer components {
      .app-container { @apply h-dvh flex flex-col bg-slate-50 dark:bg-slate-900 overflow-hidden; }
      .card-toy { @apply bg-white dark:bg-slate-800 rounded-toy p-6 shadow-2xl flex flex-col h-[calc(100%-32px)] mx-4 mt-2 border-t-[10px] relative transition-all duration-300 border-toyYellow; }
      .event-card { @apply bg-slate-50 dark:bg-slate-700/40 border border-slate-100 dark:border-slate-600 rounded-2xl p-4 mb-3 flex gap-4 active:scale-[0.96] transition-all; }
      .input-toy { @apply w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 text-sm font-bold mb-2 focus:ring-2 focus:ring-toyBlue outline-none dark:text-white; }
      .btn-icon { @apply w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg transition-all active:scale-90; }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    [v-cloak] { display: none; }
    .list-enter-active, .list-leave-active { transition: all 0.3s ease; }
    .list-enter-from, .list-leave-to { opacity: 0; transform: translateY(15px); }
  </style>
</head>
<body class="antialiased">

  <div id="app" class="app-container" v-cloak>
    <header class="bg-toyBlue dark:bg-slate-950 shrink-0 flex flex-col items-center justify-center border-b-4 border-toyYellow z-50 shadow-xl relative" style="height: 100px;">
      <img src="logo.png" 
           alt="Logo" @click="triggerLogoJoy"
           class="w-14 h-14 object-contain active:scale-95 transition-transform"
           :class="{'animate-wiggle': isWiggling}"
           onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3063/3063822.png';">
      <h1 class="text-white font-black italic uppercase text-[12px] tracking-widest opacity-60 mt-1">Mission Control • 2026</h1>
    </header>

    <main class="flex-1 overflow-hidden relative">
      <div class="swiper mySwiper h-full">
        <div class="swiper-wrapper">
          <div v-for="(page, pIdx) in navItems" :key="page.label" class="swiper-slide py-4">
            <div class="card-toy" :style="{ borderColor: page.color }">
              <div class="flex justify-between items-center mb-6">
                <h2 class="font-black italic text-3xl uppercase tracking-tighter" :style="{ color: page.color }">{{ page.label }}</h2>
                <button @click="toggleEdit(page.label)" :class="isEditing[page.label] ? 'bg-toyGreen' : 'bg-slate-100 dark:bg-slate-700'" class="btn-icon">
                  <i :class="isEditing[page.label] ? 'fas fa-check text-white' : 'fas fa-pen text-slate-400'"></i>
                </button>
              </div>

              <div class="flex-1 overflow-y-auto no-scrollbar">
                <div v-if="page.label === 'Plan'" class="flex gap-2 overflow-x-auto no-scrollbar mb-6 py-1 snap-x">
                  <button v-for="date in availableDates" :key="date" @click="currentDate = date" 
                    :class="currentDate === date ? 'bg-toyYellow text-white shadow-lg' : 'bg-slate-100 dark:bg-slate-700 text-slate-400'" 
                    class="px-5 py-3 rounded-2xl text-[13px] font-black shrink-0 snap-center uppercase">
                    {{date}}
                  </button>
                </div>

                <transition-group name="list" tag="div" class="pb-12">
                  <div v-if="getSortedData(page.label).length === 0 && !isEditing[page.label]" 
                       :key="'empty-' + page.label"
                       class="flex flex-col items-center justify-center py-20 opacity-30">
                    <i class="fas fa-map-pin text-4xl mb-4" :style="{ color: page.color }"></i>
                    <p class="text-xs font-black uppercase tracking-widest">No Missions Logged</p>
                  </div>

                  <template v-if="isEditing[page.label]">
                    <div v-for="(item, idx) in getRawData(page.label)" :key="'edit-' + page.label + idx" class="bg-slate-100 dark:bg-slate-900 p-4 rounded-2xl mb-4 relative">
                      <input v-model="item.time" class="input-toy" placeholder="TIME (e.g. 14:00)">
                      <input v-model="item.location" class="input-toy" placeholder="MISSION/LOCATION">
                      <textarea v-model="item.note" class="input-toy mb-0 text-xs" placeholder="NOTES" rows="2"></textarea>
                      <button @click="removeItem(page.label, idx)" class="absolute -top-2 -right-2 bg-toyRed text-white w-8 h-8 rounded-full border-2 border-white shadow-lg flex items-center justify-center">×</button>
                    </div>
                    <button @click="addItem(page.label)" :key="'add-' + page.label" class="w-full py-4 border-2 border-dashed rounded-2xl font-black text-xs uppercase" :style="{ color: page.color, borderColor: page.color }">+ Add Mission</button>
                  </template>

                  <template v-else>
                    <div v-for="item in getSortedData(page.label)" :key="item.id" class="event-card">
                      <div class="w-14 shrink-0 flex flex-col items-center text-toyBlue dark:text-toyYellow">
                        <span class="text-[10px] font-black uppercase tracking-tighter">{{item.time}}</span>
                        <div class="w-1 h-full bg-slate-200 dark:bg-slate-600 my-2 rounded-full opacity-30"></div>
                      </div>
                      <div class="flex-1">
                        <h3 class="font-black text-slate-800 dark:text-slate-100 text-sm uppercase italic tracking-tight">{{item.location}}</h3>
                        <p v-if="item.note" class="bg-white/60 dark:bg-slate-800/60 rounded-xl p-3 text-[11px] font-bold text-slate-500 dark:text-slate-400 mt-2 leading-relaxed border border-white/40">
                          {{item.note}}
                        </p>
                      </div>
                    </div>
                  </template>
                </transition-group>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <nav class="bg-white dark:bg-slate-950 flex border-t dark:border-slate-800 shrink-0 z-50" style="height: 90px; padding-bottom: env(safe-area-inset-bottom);">
      <div v-for="(nav, idx) in navItems" :key="nav.label" @click="goTo(idx)" 
           class="flex-1 flex flex-col items-center justify-center cursor-pointer" :style="{ opacity: activeIdx === idx ? 1 : 0.3 }">
        <i :class="nav.icon" class="text-xl mb-1"></i>
        <span class="text-[12px] font-black uppercase tracking-tighter">{{ nav.label }}</span>
      </div>
    </nav>
  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;
    const FIREBASE_CONFIG = { apiKey: "AIzaSyA9rkD3I-5PX7Gszl41SlPCYALIeil2mkA", authDomain: "toystorytravel.firebaseapp.com", databaseURL: "https://toystorytravel-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();

    createApp({
      setup() {
        const swiperInstance = ref(null);
        const activeIdx = ref(0);
        const loading = ref(true);
        const currentDate = ref('5/21');
        const isWiggling = ref(false);
        const isEditing = ref({});
        const availableDates = ['5/21','5/22','5/23','5/24','5/25','5/26','5/27','5/28','5/29','5/30','5/31','6/1','6/2','6/3','6/4','6/5','6/6','6/7'];
        const travelData = ref({ Plan: {}, Tickets: [], Hotel: [], Budget: [], Food: [], Traffic: [], List: [] });

        const navItems = [
          { label: 'Plan', icon: 'fas fa-map-marked-alt', color: '#F1C40F' },
          { label: 'Tickets', icon: 'fas fa-ticket-alt', color: '#E74C3C' },
          { label: 'Hotel', icon: 'fas fa-hotel', color: '#2ECC71' },
          { label: 'Budget', icon: 'fas fa-piggy-bank', color: '#3498DB' },
          { label: 'Food', icon: 'fas fa-utensils', color: '#FF8C00' },
          { label: 'Traffic', icon: 'fas fa-bus-alt', color: '#8E44AD' },
          { label: 'List', icon: 'fas fa-clipboard-list', color: '#16A085' }
        ];

        const getRawData = (label) => label === 'Plan' ? (travelData.value.Plan[currentDate.value] || []) : (travelData.value[label] || []);
        const getSortedData = (label) => {
          const data = getRawData(label);
          if (label === 'Plan') return [...data].sort((a, b) => (a.time || "").localeCompare(b.time || ""));
          return data;
        };
        
        const toggleEdit = async (label) => {
          if (isEditing.value[label]) {
            loading.value = true;
            await db.ref('universalData').set(JSON.parse(JSON.stringify(travelData.value)));
            isEditing.value[label] = false;
            loading.value = false;
          } else { isEditing.value[label] = true; }
        };

        const addItem = (label) => {
          if (label === 'Plan' && !travelData.value.Plan[currentDate.value]) travelData.value.Plan[currentDate.value] = [];
          getRawData(label).push({ id: Date.now(), time: '', location: '', note: '' });
        };
        const removeItem = (label, idx) => getRawData(label).splice(idx, 1);
        const goTo = (idx) => swiperInstance.value.slideTo(idx);
        
        const triggerLogoJoy = () => { 
          isWiggling.value = true; 
          setTimeout(() => isWiggling.value = false, 700); 
        };

        onMounted(() => {
          db.ref('universalData').on('value', (s) => { if(s.val()) travelData.value = s.val(); loading.value = false; });
          swiperInstance.value = new Swiper(".mySwiper", { 
            speed: 350, on: { slideChange: function() { activeIdx.value = this.activeIndex; } } 
          });
        });

        return { travelData, isEditing, activeIdx, goTo, toggleEdit, loading, currentDate, availableDates, navItems, getSortedData, addItem, removeItem, triggerLogoJoy, isWiggling }
      }
    }).mount('#app')
  </script>
</body>
</html>
