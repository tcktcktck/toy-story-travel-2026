<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Euro 2026 Adventure</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: { extend: { colors: { toyBlue: '#2A75B3', toyYellow: '#F1C40F', toyRed: '#E74C3C', toyGreen: '#2ECC71', toyPurple: '#9B59B6', toyWoody: '#F39C12' }}}
    }
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .app-container { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background-color: #E0F2FE; }
      .nav-item { @apply flex flex-col items-center justify-center cursor-pointer flex-1 transition-all duration-300; }
      .nav-text { @apply text-[8px] font-black mt-1 uppercase tracking-tighter; }
      .card-toy { @apply bg-white rounded-[2.5rem] p-5 shadow-xl border-b-8 border-slate-200 flex flex-col h-[calc(100%-25px)] mx-4 relative; }
      .edit-input { @apply w-full p-2 mb-2 border-2 border-dashed border-slate-200 rounded-xl outline-none text-sm font-bold bg-blue-50/50; }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .header-logo { height: 60px; transform: scale(1.5); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15)); }
  </style>
</head>
<body>

  <div id="app" class="app-container" v-cloak>
    
    <header class="bg-toyBlue border-b-4 border-toyYellow shrink-0 flex items-center justify-center relative z-50" style="height: 75px;">
      <img src="pixelframe-design_26fq9zkc-removebg-preview.png" alt="Euro 2026" class="header-logo object-contain">
      <div v-if="loading" class="absolute right-6 top-1/2 -translate-y-1/2"><div class="w-2 h-2 bg-toyGreen rounded-full animate-ping"></div></div>
    </header>

    <main class="flex-1 w-full overflow-hidden relative">
      <div class="swiper mySwiper h-full w-full pt-4">
        <div class="swiper-wrapper">
          
          <div v-for="(page, index) in navItems" :key="index" class="swiper-slide">
            <div class="card-toy" :style="{ borderLeft: '12px solid ' + page.color }">
              
              <div class="flex justify-between items-center mb-4 shrink-0">
                <h2 class="text-xl font-black uppercase" :style="{ color: page.color }">{{ page.label }}</h2>
                <button @click="toggleEdit(page.label)">
                  <i :class="isEditing[page.label] ? 'fas fa-check-circle text-toyGreen text-2xl' : 'fas fa-edit text-slate-200 text-xl'"></i>
                </button>
              </div>
              
              <div class="flex-1 overflow-y-auto no-scrollbar" style="-webkit-overflow-scrolling: touch;">
                
                <div v-if="page.label === 'Plan'" class="flex gap-2 overflow-x-auto no-scrollbar mb-4 py-1 border-b swiper-no-swiping shrink-0">
                  <button v-for="date in availableDates" @click="currentDate = date" :class="currentDate === date ? 'bg-toyYellow text-white border-toyYellow' : 'bg-white text-slate-400 border-slate-100'" class="px-4 py-1 rounded-xl text-[10px] font-black border shrink-0 transition-all">{{date}}</button>
                </div>

                <div v-if="isEditing[page.label]" class="space-y-3 pb-20">
                  <div v-for="(item, idx) in getRawData(page.label)" :key="idx" class="p-3 bg-slate-50 rounded-xl relative border-2 border-dashed border-slate-100">
                    <input v-model="item.title" class="edit-input" :placeholder="page.label === 'Plan' ? 'Time (e.g. 09:00)' : 'Title / Flight No.'">
                    <textarea v-model="item.content" class="edit-input text-xs" :placeholder="'Add ' + page.label + ' details...'"></textarea>
                    <button @click="removeItem(page.label, idx)" class="absolute top-2 right-2 text-toyRed p-1 opacity-50">✕</button>
                  </div>
                  <button @click="addItem(page.label)" class="w-full py-3 border-2 border-dashed rounded-xl text-xs font-black" :style="{ color: page.color, borderColor: page.color }">
                    + ADD {{ page.label.toUpperCase() }}
                  </button>
                </div>

                <div v-else class="space-y-1 pb-10">
                  <div v-for="item in getSortedData(page.label)" :key="item.title" class="flex gap-4 p-4 border-b border-slate-50 items-start">
                    <span class="font-black text-xs w-16 pt-1 shrink-0" :style="{ color: page.color }">{{item.title}}</span>
                    <p class="font-bold text-sm text-slate-700 leading-relaxed whitespace-pre-line">{{item.content}}</p>
                  </div>
                  <div v-if="!getSortedData(page.label).length" class="flex flex-col items-center justify-center py-20 opacity-20">
                    <i :class="page.icon" class="text-5xl mb-2"></i>
                    <p class="text-xs font-black">EMPTY</p>
                  </div>
                </div>

              </div>
            </div>
          </div>

        </div>
      </div>
    </main>

    <nav class="bg-white flex border-t shrink-0 z-50 shadow-[0_-5px_20px_rgba(0,0,0,0.05)]" 
         style="height: calc(75px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);">
      <div v-for="(nav, idx) in navItems" :key="idx" 
           @click="goTo(idx)" 
           :class="activeIdx === idx ? 'text-toyBlue scale-110' : 'text-slate-300'"
           class="nav-item">
        <i :class="nav.icon + ' text-xl'"></i>
        <span class="nav-text">{{ nav.label }}</span>
      </div>
    </nav>
  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    const firebaseConfig = { 
      apiKey: "AIzaSyA9rkD3I-5PX7Gszl41SlPCYALIeil2mkA", 
      authDomain: "toystorytravel.firebaseapp.com", 
      projectId: "toystorytravel", 
      databaseURL: "https://toystorytravel-default-rtdb.firebaseio.com/" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    createApp({
      setup() {
        const swiperInstance = ref(null);
        const activeIdx = ref(0);
        const loading = ref(true);
        const currentDate = ref('5/21');
        const availableDates = ['5/21','5/22','5/23','5/24','5/25','5/26','5/27','5/28','5/29','5/30','5/31','6/1','6/2','6/3','6/4','6/5','6/6','6/7'];
        const isEditing = ref({});
        const travelData = ref({});

        const navItems = [
          { label: 'Plan', icon: 'fas fa-calendar-day', color: '#F1C40F' },
          { label: 'Tickets', icon: 'fas fa-ticket-alt', color: '#E74C3C' },
          { label: 'Flight', icon: 'fas fa-plane', color: '#9B59B6' },
          { label: 'Hotel', icon: 'fas fa-hotel', color: '#2ECC71' },
          { label: 'Map', icon: 'fas fa-map-marked-alt', color: '#3498DB' },
          { label: 'Pack', icon: 'fas fa-suitcase', color: '#F39C12' },
          { label: 'Budget', icon: 'fas fa-piggy-bank', color: '#16A085' }
        ];

        // 獲取原始數據（用於編輯）
        const getRawData = (label) => {
          if (!travelData.value[label]) travelData.value[label] = (label === 'Plan' ? {} : []);
          if (label === 'Plan') {
            if (!travelData.value['Plan'][currentDate.value]) travelData.value['Plan'][currentDate.value] = [];
            return travelData.value['Plan'][currentDate.value];
          }
          return travelData.value[label];
        };

        // 【核心邏輯】獲取排序後的數據（用於顯示）
        const getSortedData = (label) => {
          let data = getRawData(label);
          // 根據 title (時間或編號) 進行順時序排序
          return [...data].sort((a, b) => {
            return (a.title || "").localeCompare(b.title || "", undefined, {numeric: true, sensitivity: 'base'});
          });
        };

        const loadFirebase = () => {
          db.ref('universalData').on('value', (s) => {
            travelData.value = s.val() || {};
            loading.value = false;
          });
        };

        const toggleEdit = (label) => {
          isEditing.value[label] = !isEditing.value[label];
          if(!isEditing.value[label]) {
            loading.value = true;
            db.ref('universalData').set(travelData.value).then(() => loading.value = false);
          }
        };

        const addItem = (label) => {
          const target = getRawData(label);
          target.push({ title: label === 'Plan' ? '09:00' : '', content: '' });
        };

        const removeItem = (label, idx) => {
          const target = getRawData(label);
          target.splice(idx, 1);
        };

        const goTo = (idx) => {
          if (swiperInstance.value) {
            swiperInstance.value.slideTo(idx);
            activeIdx.value = idx;
          }
        };

        onMounted(() => {
          loadFirebase();
          swiperInstance.value = new Swiper(".mySwiper", { 
            speed: 400,
            on: { slideChange: function() { activeIdx.value = this.activeIndex; } }
          });
        });

        return { travelData, isEditing, activeIdx, goTo, toggleEdit, loading, currentDate, availableDates, navItems, addItem, getRawData, getSortedData, removeItem }
      }
    }).mount('#app')
  </script>
</body>
</html>
