<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Euro 2026 Adventure | Official Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: { extend: { colors: { toyBlue: '#2A75B3', toyYellow: '#F1C40F', toyRed: '#E74C3C', toyGreen: '#2ECC71' }}}
    }
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .app-container { height: 100dvh; display: flex; flex-direction: column; background-color: #F8FAFC; }
      .card-toy { @apply bg-white rounded-[2.5rem] p-6 shadow-xl flex flex-col h-[calc(100%-35px)] mx-4 mt-2 border border-slate-100 relative overflow-hidden; }
      .event-card { @apply bg-white border border-slate-100 rounded-3xl p-4 shadow-sm mb-3 flex gap-3; }
      .time-tag { @apply w-12 shrink-0 text-[10px] font-black text-slate-400 pt-1; }
      .note-box { @apply bg-slate-50 rounded-xl p-3 text-[10px] font-bold text-slate-500 whitespace-pre-line leading-relaxed; }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    [v-cloak] { display: none; }
  </style>
</head>
<body>

  <div id="app" class="app-container" v-cloak>
    <header class="bg-toyBlue border-b-4 border-toyYellow shrink-0 flex items-center justify-center relative" style="height: 75px;">
      <h1 class="text-white font-black italic uppercase text-xl tracking-tighter">Euro 2026 Planner</h1>
      <div v-if="loading" class="absolute right-6"><div class="w-2 h-2 bg-toyGreen rounded-full animate-ping"></div></div>
    </header>

    <main class="flex-1 overflow-hidden relative">
      <div class="swiper mySwiper h-full w-full">
        <div class="swiper-wrapper">
          
          <div v-for="(page, index) in navItems" :key="index" class="swiper-slide py-4">
            <div class="card-toy" :style="{ borderTop: '10px solid ' + page.color }">
              <div class="flex justify-between items-center mb-4">
                <h2 class="font-black italic text-2xl uppercase" :style="{ color: page.color }">{{ page.label }}</h2>
                <button @click="toggleEdit(page.label)" class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                  <i :class="isEditing[page.label] ? 'fas fa-check text-toyGreen' : 'fas fa-pen text-slate-300'"></i>
                </button>
              </div>

              <div class="flex-1 overflow-y-auto no-scrollbar">
                <div v-if="page.label === 'Plan'" class="flex gap-2 overflow-x-auto no-scrollbar mb-4 shrink-0 swiper-no-swiping">
                  <button v-for="date in availableDates" @click="currentDate = date" 
                    :class="currentDate === date ? 'bg-toyYellow text-white shadow-md' : 'bg-slate-100 text-slate-400'" 
                    class="px-4 py-2 rounded-xl text-[10px] font-black shrink-0 transition-all">
                    {{date}}
                  </button>
                </div>

                <div v-if="isEditing[page.label]">
                  <div v-for="(item, idx) in getRawData(page.label)" :key="idx" class="bg-slate-50 p-4 rounded-3xl mb-4 relative border-2 border-dashed border-slate-200">
                    <input v-model="item.time" class="w-full bg-white border border-slate-100 rounded-xl px-3 py-2 text-sm font-bold mb-2 outline-none" placeholder="🕒 Time">
                    <input v-model="item.location" class="w-full bg-white border border-slate-100 rounded-xl px-3 py-2 text-sm font-bold mb-2 outline-none" placeholder="📍 Location">
                    <textarea v-model="item.note" class="w-full bg-white border border-slate-100 rounded-xl px-3 py-2 text-xs font-medium outline-none" rows="2"></textarea>
                    <button @click="removeItem(page.label, idx)" class="absolute -top-2 -right-2 bg-white text-toyRed shadow-md w-8 h-8 rounded-full flex items-center justify-center border border-slate-100">✕</button>
                  </div>
                  <button @click="addItem(page.label)" class="w-full py-4 border-2 border-dashed rounded-3xl text-xs font-black" :style="{ color: page.color, borderColor: page.color }">+ ADD NEW</button>
                </div>

                <div v-else>
                  <div v-for="item in getSortedData(page.label)" :key="item.location" class="event-card">
                    <div class="time-tag">{{item.time}}</div>
                    <div class="flex-1">
                      <h3 class="font-black text-slate-800 text-sm mb-1">{{item.location}}</h3>
                      <div v-if="item.note" class="note-box">{{item.note}}</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <nav class="bg-white flex border-t" style="height: 80px; padding-bottom: env(safe-area-inset-bottom);">
      <div v-for="(nav, idx) in navItems" :key="idx" @click="goTo(idx)" :class="activeIdx === idx ? 'text-toyBlue scale-110' : 'text-slate-300'" class="flex-1 flex flex-col items-center justify-center cursor-pointer transition-all">
        <i :class="nav.icon + ' text-xl'"></i>
        <span class="text-[8px] font-black mt-1 uppercase">{{ nav.label }}</span>
      </div>
    </nav>
  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;
    firebase.initializeApp({ apiKey: "AIzaSyA9rkD3I-5PX7Gszl41SlPCYALIeil2mkA", authDomain: "toystorytravel.firebaseapp.com", projectId: "toystorytravel", databaseURL: "https://toystorytravel-default-rtdb.firebaseio.com/" });
    const db = firebase.database();

    createApp({
      setup() {
        const swiperInstance = ref(null);
        const activeIdx = ref(0);
        const loading = ref(true);
        const currentDate = ref('5/21');
        const isEditing = ref({});
        const availableDates = ['5/21','5/22','5/23','5/24','5/25','5/26','5/27','5/28','5/29','5/30','5/31','6/1','6/4','6/6'];
        
        const travelData = ref({
          Plan: {
            '5/21': [{ time: '12:25', location: 'Heathrow Airport', note: 'Elizabeth Line 前往 Ilford (£15.50)' }],
            '5/22': [
              { time: '11:00', location: 'Bread Ahead Bakery', note: 'Wembley Brunch' },
              { time: '14:00', location: 'Mundo Pixar Experience', note: 'Wembley Park' },
              { time: '19:30', location: 'Osteria Angelina', note: 'Chef\'s Counter | 預約: #3UACFL4EMUDE' }
            ],
            '5/23': [
              { time: '11:07', location: 'Avanti West Coast', note: 'London Euston ➔ Liverpool\n座位: Coach D, Seat 37, 38' },
              { time: '20:00', location: 'Belzan (Dinner)', note: '訂位代號: Ref BQ9QLVH6' }
            ],
            '5/24': [
              { time: '09:45', location: 'Anfield Stadium Tour', note: '訂單: 20448981' },
              { time: '16:00', location: 'Liverpool vs Brentford', note: 'Beat Lounge | Block L15\n£778.00 (HK$8,231.72)' }
            ],
            '5/25': [
              { time: '18:08', location: 'Avanti West Coast', note: 'Liverpool ➔ London Euston\n座位: Coach D, Seat 39, 40' },
              { time: '20:30', location: 'Dishoom King\'s Cross', note: '晚餐 (Walk-in)' }
            ],
            '5/26': [
              { time: '13:30', location: 'Wes Anderson Exhibition', note: 'Design Museum | 訂單: DMOJ21KHJZSP5' },
              { time: '20:00', location: 'OMA (Dinner)', note: 'Borough Market 2F | 代號: Ref 4DPE6B3M7653' }
            ],
            '5/27': [
              { time: '12:45', location: 'Inside Aardman (Young V&A)', note: '笑笑羊展覽 | 訂單: 3741138' },
              { time: '20:00', location: 'The Wolseley City', note: 'Monument | 代號: Ref CVBBM23B8VVU' }
            ],
            '5/28': [{ time: '13:00', location: '航班 BA8089 (LGW-BCN)', note: '抵達 BCN T1 (16:15)' }],
            '5/29': [
              { time: '10:00', location: 'Park Güell 入場', note: '9:30 步行上山' },
              { time: '14:30', location: '聖家堂 Sagrada Família', note: '含登塔 ＋ 語音導覽' },
              { time: '20:00', location: 'Casa Batlló Magic Nights', note: '屋頂音樂會 ＋ 飲品' }
            ],
            '5/30': [
              { time: '10:15', location: 'Montserrat Tour 出發', note: '19號月台集合 | 13:00 唱詩班' }
            ],
            '5/31': [
              { time: '16:30', location: 'Montjuïc 城堡', note: '週日免費 | 21:18 日落' }
            ],
            '6/1': [
              { time: '10:30', location: 'Casa Milà (La Pedrera)', note: '米拉之家入場' },
              { time: '15:05', location: 'Aerobús 前往機場 T2', note: '⚠️ 係 T2 離境！' },
              { time: '18:25', location: '航班 TO4757 (BCN-ORY)', note: '前往巴黎' }
            ]
          },
          Tickets: [
            { time: '5/24', location: 'LFC Match Ticket', note: 'HK$8,231.72' },
            { time: '5/29', location: 'Casa Batlló Music Night', note: 'HK$599.00' }
          ],
          Hotel: [
            { time: '5/25', location: 'Finsbury Rose', note: 'London Accommodation' },
            { time: '5/28', location: 'Gracia Apartment', note: 'Barcelona' }
          ],
          Budget: [
            { time: 'Total', location: '歐遊預算', note: 'Confirmed Version' }
          ]
        });

        const navItems = [
          { label: 'Plan', icon: 'fas fa-calendar-alt', color: '#F1C40F' },
          { label: 'Tickets', icon: 'fas fa-ticket-alt', color: '#E74C3C' },
          { label: 'Hotel', icon: 'fas fa-hotel', color: '#2ECC71' },
          { label: 'Budget', icon: 'fas fa-piggy-bank', color: '#3498DB' }
        ];

        const getRawData = (label) => label === 'Plan' ? (travelData.value.Plan[currentDate.value] || []) : (travelData.value[label] || []);
        const getSortedData = (label) => [...getRawData(label)].sort((a, b) => (a.time || "").localeCompare(b.time || ""));
        const toggleEdit = async (label) => {
          if (isEditing.value[label]) {
            loading.value = true;
            await db.ref('universalData').set(JSON.parse(JSON.stringify(travelData.value)));
            isEditing.value[label] = false;
            loading.value = false;
          } else { isEditing.value[label] = true; }
        };
        const addItem = (label) => getRawData(label).push({ time: '', location: '', note: '' });
        const removeItem = (label, idx) => getRawData(label).splice(idx, 1);
        const goTo = (idx) => swiperInstance.value.slideTo(idx);

        onMounted(() => {
          db.ref('universalData').on('value', (s) => { if(s.val()) travelData.value = s.val(); loading.value = false; });
          swiperInstance.value = new Swiper(".mySwiper", { speed: 400, on: { slideChange: function() { activeIdx.value = this.activeIndex; } } });
        });

        return { travelData, isEditing, activeIdx, goTo, toggleEdit, loading, currentDate, availableDates, navItems, addItem, getRawData, getSortedData, removeItem }
      }
    }).mount('#app')
  </script>
</body>
</html>
