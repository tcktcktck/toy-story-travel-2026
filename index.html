<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Euro 2026 | Full Mission Control V5.7</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style type="text/tailwindcss">
    @layer components {
      .app-container { @apply h-dvh flex flex-col bg-slate-50 dark:bg-slate-900 transition-colors duration-500 overflow-hidden; }
      .card-toy { @apply bg-white dark:bg-slate-800 rounded-toy p-6 shadow-2xl flex flex-col h-[calc(100%-32px)] mx-4 mt-2 border-t-[10px] relative transition-all duration-300; }
      .event-card { @apply bg-slate-50 dark:bg-slate-700/40 border border-slate-100 dark:border-slate-600 rounded-2xl p-4 mb-3 flex gap-4 active:scale-[0.96] transition-all duration-200; }
      .nav-item { @apply flex-shrink-0 w-[82px] flex flex-col items-center justify-center cursor-pointer transition-opacity; }
      .nav-label { @apply text-[12px] font-black mt-1.5 uppercase tracking-tighter; }
      .input-toy { @apply w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm font-bold mb-2 focus:ring-2 focus:ring-toyBlue outline-none dark:text-white transition-all; }
      .btn-icon { @apply w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg transition-all active:scale-90; }
      .btn-add { @apply w-full py-5 border-4 border-dashed rounded-3xl font-black text-sm uppercase transition-all active:bg-slate-100 dark:active:bg-slate-700 active:scale-[0.98] mt-2; }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .list-move, .list-enter-active, .list-leave-active { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .list-enter-from, .list-leave-to { opacity: 0; transform: translateY(20px); }
    @keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-1deg); } 75% { transform: rotate(1deg); } }
    .animate-wiggle { animation: wiggle 0.2s ease-in-out infinite; }
    [v-cloak] { display: none; }
  </style>
</head>
<body>

  <div id="app" class="app-container" v-cloak>
    <header class="bg-toyBlue dark:bg-slate-950 shrink-0 flex flex-col items-center justify-center border-b-4 border-toyYellow z-50 shadow-xl relative" style="height: 100px;">
      <img src="pixelframe-design_26fq9zkc-removebg-preview.png" 
           alt="Logo" @click="triggerLogoJoy"
           class="w-14 h-14 object-contain active:scale-95 transition-transform mb-1"
           style="image-rendering: pixelated; image-rendering: -moz-crisp-edges;"
           onerror="this.style.display='none';">
      <h1 class="text-white font-black italic uppercase text-[10px] tracking-widest opacity-80">Mission Control • 2026</h1>
      
      <div v-if="loading" class="absolute right-6 top-1/2 -translate-y-1/2 flex gap-1">
        <div v-for="i in 3" :key="i" class="w-1.5 h-1.5 bg-toyGreen rounded-full animate-bounce" :style="{ animationDelay: -(i*0.1) + 's' }"></div>
      </div>
    </header>

    <main class="flex-1 overflow-hidden relative">
      <div class="swiper mySwiper h-full w-full">
        <div class="swiper-wrapper">
          
          <div v-for="(page, pIdx) in navItems" :key="page.label" class="swiper-slide py-4">
            <div class="card-toy" :class="{'animate-wiggle': isWiggling}" :style="{ borderColor: page.color }">
              
              <div class="flex justify-between items-center mb-6">
                <h2 class="font-black italic text-3xl uppercase tracking-tighter leading-none" :style="{ color: page.color }">{{ page.label }}</h2>
                <button @click="toggleEdit(page.label)" :class="isEditing[page.label] ? 'bg-toyGreen' : 'bg-slate-100 dark:bg-slate-700'" class="btn-icon">
                  <i :class="isEditing[page.label] ? 'fas fa-check text-white' : 'fas fa-pen text-slate-400'"></i>
                </button>
              </div>

              <div class="flex-1 overflow-y-auto no-scrollbar">
                <div v-if="page.label === 'Plan'" class="flex gap-2 overflow-x-auto no-scrollbar mb-6 py-1 snap-x swiper-no-swiping relative z-10">
                  <button v-for="date in availableDates" :key="date" @click="currentDate = date" 
                    :class="currentDate === date ? 'bg-toyYellow text-white shadow-xl scale-105' : 'bg-slate-100 dark:bg-slate-700 text-slate-400'" 
                    class="px-5 py-3 rounded-2xl text-[13px] font-black shrink-0 transition-all snap-center uppercase">
                    {{date}}
                  </button>
                </div>

                <transition-group name="list" tag="div" class="pb-12">
                  <template v-if="isEditing[page.label]">
                    <div v-for="(item, idx) in getRawData(page.label)" :key="'edit-' + page.label + idx" 
                         class="bg-slate-100 dark:bg-slate-900 p-5 rounded-3xl mb-4 relative border-2 border-dashed border-slate-300 dark:border-slate-700">
                      <input v-model="item.time" class="input-toy" placeholder="Time">
                      <input v-model="item.location" class="input-toy" placeholder="Location">
                      <textarea v-model="item.note" class="input-toy mb-0 text-xs" placeholder="Note" rows="2"></textarea>
                      <button @click="removeItem(page.label, idx)" class="absolute -top-3 -right-3 bg-toyRed text-white w-9 h-9 rounded-full shadow-xl border-4 border-white dark:border-slate-800">
                        <i class="fas fa-times"></i>
                      </button>
                    </div>
                    <button @click="addItem(page.label)" class="btn-add" :style="{ color: page.color, borderColor: page.color }">
                      + Add Entry
                    </button>
                  </template>

                  <template v-else>
                    <div v-for="item in getSortedData(page.label)" :key="item.id" class="event-card">
                      <div class="w-14 shrink-0 flex flex-col items-center text-center">
                        <span class="text-[10px] font-black text-toyBlue dark:text-toyYellow uppercase tracking-tighter">{{item.time}}</span>
                        <div class="w-1 h-full bg-slate-200 dark:bg-slate-600 my-2 rounded-full opacity-30"></div>
                      </div>
                      <div class="flex-1">
                        <h3 class="font-black text-slate-800 dark:text-slate-100 text-sm uppercase italic tracking-tight">{{item.location}}</h3>
                        <p v-if="item.note" class="bg-white/60 dark:bg-slate-800/60 rounded-xl p-3 text-[11px] font-bold text-slate-500 dark:text-slate-400 mt-2 whitespace-pre-line leading-relaxed border border-white/40 dark:border-slate-700/40">
                          {{item.note}}
                        </p>
                      </div>
                    </div>
                  </template>
                </transition-group>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>

    <nav class="bg-white dark:bg-slate-950 flex border-t dark:border-slate-800 overflow-x-auto no-scrollbar snap-x shrink-0 z-50" style="height: 90px; padding-bottom: env(safe-area-inset-bottom);">
      <div v-for="(nav, idx) in navItems" :key="nav.label" @click="goTo(idx)" 
           class="nav-item" :class="activeIdx === idx ? 'opacity-100' : 'opacity-25'">
        <div :class="activeIdx === idx ? 'bg-slate-100 dark:bg-slate-800 shadow-inner' : ''" class="w-14 h-14 rounded-2xl flex items-center justify-center transition-all duration-300">
          <i :class="[nav.icon, activeIdx === idx ? 'text-toyBlue dark:text-toyYellow' : 'text-slate-400']" class="text-xl"></i>
        </div>
        <span class="nav-label" :class="activeIdx === idx ? 'text-slate-900 dark:text-white' : 'text-slate-400'">{{ nav.label }}</span>
      </div>
    </nav>
  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;
    
    const FIREBASE_CONFIG = { apiKey: "AIzaSyA9rkD3I-5PX7Gszl41SlPCYALIeil2mkA", authDomain: "toystorytravel.firebaseapp.com", databaseURL: "https://toystorytravel-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();

    createApp({
      setup() {
        const swiperInstance = ref(null);
        const activeIdx = ref(0);
        const loading = ref(true);
        const currentDate = ref('5/21');
        const isWiggling = ref(false);
        const isEditing = ref({});
        const availableDates = ['5/21','5/22','5/23','5/24','5/25','5/26','5/27','5/28','5/29','5/30','5/31','6/1'];
        
        const travelData = ref({
          Plan: {
            '5/21': [{ id: 1, time: '12:25', location: 'Heathrow LHR', note: 'Elizabeth Line -> Ilford (£15.50)\nCheck-in Travelodge' }],
            '5/23': [{ id: 3, time: '12:00', location: 'London to Liverpool', note: 'Avanti West Coast' }, { id: 4, time: '20:00', location: 'Dinner @ Belzan', note: 'Booking: BQ9QLVH6' }],
            '5/24': [{ id: 5, time: '09:45', location: 'Anfield Stadium Tour', note: 'LFC-STA-26' }, { id: 6, time: '16:00', location: 'LFC vs Brentford', note: 'Match Day' }],
            '5/26': [{ id: 8, time: '13:30', location: 'Wes Anderson', note: 'Design Museum' }, { id: 9, time: '20:00', location: 'Dinner @ OMA', note: 'Borough Market' }],
            '5/27': [{ id: 10, time: '12:45', location: 'Young V&A', note: 'Inside Aardman' }, { id: 11, time: '20:00', location: 'Dinner @ The Wolseley', note: 'WLS-8890' }],
            '5/28': [{ id: 12, time: '09:00', location: 'Fly to Barcelona', note: 'BA8089 (LGW South Terminal)' }],
            '5/29': [{ id: 13, time: '10:00', location: 'Barcelona Exploration', note: 'BCN Day 1' }],
            '5/30': [{ id: 14, time: '13:00', location: 'Gothic Quarter', note: 'Siesta & Tapas' }],
            '5/31': [{ id: 15, time: '11:00', location: 'Sagrada Familia', note: 'Gaudi Mission' }],
            '6/1': [{ id: 16, time: '15:00', location: 'Journey Home', note: 'Final Mission Control Clear' }]
          },
          Tickets: [
            { id: 101, time: '5/24', location: 'LFC vs Brentford', note: 'Hospitality Pass' },
            { id: 102, time: '5/24', location: 'Anfield Tour', note: 'Ref: LFC-STA-26' },
            { id: 103, time: '5/26', location: 'Wes Anderson', note: 'Design Museum' },
            { id: 104, time: '5/27', location: 'Inside Aardman', note: 'Young V&A' }
          ],
          Hotel: [
            { id: 201, time: '5/21', location: 'Travelodge Ilford', note: 'London Arrival' },
            { id: 202, time: '5/23', location: 'Hope Street Hotel', note: 'Liverpool' },
            { id: 203, time: '5/25', location: 'Finsbury Rose', note: 'London Base' },
            { id: 204, time: '5/28', location: 'Barcelona Stay', note: 'BCN Base' }
          ],
          Budget: [
            { id: 301, time: 'Z1-4', location: 'Elizabeth Line', note: '£15.50' },
            { id: 302, time: 'CAP', location: 'London Daily Cap', note: '£11.70' },
            { id: 303, time: 'BCN', location: 'Barcelona Budget', note: 'Spreadsheet Sync' }
          ],
          Food: [
            { id: 401, time: '5/23', location: 'Belzan', note: 'Ref: BQ9QLVH6' },
            { id: 402, time: '5/26', location: 'OMA', note: 'Borough Market' },
            { id: 403, time: '5/27', location: 'The Wolseley', note: 'WLS-8890' }
          ],
          Traffic: [
            { id: 501, time: '5/23', location: 'Euston -> Lime St', note: 'Train' },
            { id: 502, time: '5/28', location: 'LGW -> BCN', note: 'Flight BA8089' }
          ],
          List: []
        });

        const navItems = [
          { label: 'Plan', icon: 'fas fa-map-marked-alt', color: '#F1C40F' },
          { label: 'Tickets', icon: 'fas fa-ticket-alt', color: '#E74C3C' },
          { label: 'Hotel', icon: 'fas fa-hotel', color: '#2ECC71' },
          { label: 'Budget', icon: 'fas fa-piggy-bank', color: '#3498DB' },
          { label: 'Food', icon: 'fas fa-utensils', color: '#FF8C00' },
          { label: 'Traffic', icon: 'fas fa-bus-alt', color: '#8E44AD' },
          { label: 'List', icon: 'fas fa-clipboard-list', color: '#16A085' }
        ];

        const getRawData = (label) => label === 'Plan' ? (travelData.value.Plan[currentDate.value] || []) : (travelData.value[label] || []);
        const getSortedData = (label) => {
          const data = getRawData(label);
          if (['Tickets', 'Hotel', 'Food', 'Traffic'].includes(label)) {
             return [...data].sort((a, b) => (a.time || "").localeCompare(b.time || ""));
          }
          return label === 'Plan' ? [...data].sort((a, b) => (a.time || "").localeCompare(b.time || "")) : data;
        };
        
        const toggleEdit = async (label) => {
          if (isEditing.value[label]) {
            loading.value = true;
            await db.ref('universalData').set(JSON.parse(JSON.stringify(travelData.value)));
            isEditing.value[label] = false;
            loading.value = false;
          } else { isEditing.value[label] = true; }
        };

        const addItem = (label) => getRawData(label).push({ id: Date.now(), time: '', location: '', note: '' });
        const removeItem = (label, idx) => getRawData(label).splice(idx, 1);
        const goTo = (idx) => swiperInstance.value.slideTo(idx);
        const triggerLogoJoy = () => { isWiggling.value = true; setTimeout(() => isWiggling.value = false, 500); };

        onMounted(() => {
          db.ref('universalData').on('value', (s) => { if(s.val()) travelData.value = s.val(); loading.value = false; });
          swiperInstance.value = new Swiper(".mySwiper", { 
            speed: 350, resistanceRatio: 0.85,
            on: { slideChange: function() { activeIdx.value = this.activeIndex; } } 
          });
        });

        return { travelData, isEditing, activeIdx, goTo, toggleEdit, loading, currentDate, availableDates, navItems, getRawData, getSortedData, addItem, removeItem, triggerLogoJoy, isWiggling }
      }
    }).mount('#app')
  </script>
</body>
</html>
