<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Infinity and Beyond!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <script>
    // 確保 tailwind 設定正確執行
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            toyBlue: '#2A75B3',   
            toyYellow: '#F1C40F', 
            toyRed: '#E74C3C',    
            toyGreen: '#2ECC71',  
            toyPurple: '#9B59B6', 
            toyWoody: '#F39C12'   
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .custom-scrollbar::-webkit-scrollbar { display: none; }
      .animate-spin-slow { animation: spin 8s linear infinite; }
    }
    body { background-color: #f1f5f9; }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen">

  <div id="app" class="w-full max-w-md h-[95vh] bg-sky-50 shadow-2xl flex flex-col overflow-hidden sm:rounded-[3rem] border-8 border-slate-800 relative">
    
    <header class="bg-toyBlue p-5 text-white text-center shadow-lg shrink-0 border-b-4 border-toyYellow">
      <h1 class="text-2xl font-black tracking-tighter drop-shadow-lg">
        <span class="text-toyYellow text-3xl italic">TOY</span> STORY TRAVEL
      </h1>
      <p class="text-[10px] font-bold tracking-[0.2em] mt-1 text-blue-100">TO INFINITY AND BEYOND!</p>
    </header>

    <main class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar pb-24">
      
      <section class="bg-white rounded-3xl p-4 shadow-sm border-l-8 border-toyYellow border-b-4 border-slate-200">
        <div class="flex items-center space-x-2 mb-3">
          <i class="fas fa-calendar-check text-toyYellow text-xl"></i>
          <h2 class="text-lg font-black text-slate-700">安仔嘅行程表</h2>
        </div>
        <div class="space-y-3">
          <div v-for="item in itinerary" class="flex items-start space-x-3 p-3 rounded-2xl bg-amber-50">
            <span class="bg-toyWoody text-white text-[10px] font-black px-2 py-1 rounded-lg shadow-sm">{{ item.time }}</span>
            <div>
              <p class="text-sm font-bold text-slate-800">{{ item.activity }}</p>
              <p class="text-[10px] text-slate-500"><i class="fas fa-map-pin text-toyRed mr-1"></i>{{ item.loc }}</p>
            </div>
          </div>
        </div>
      </section>

      <section class="bg-white rounded-3xl p-4 shadow-sm border-l-8 border-toyBlue border-b-4 border-slate-200">
        <div class="flex items-center space-x-2 mb-3">
          <i class="fas fa-compass text-toyBlue text-xl"></i>
          <h2 class="text-lg font-black text-slate-700">玩具地圖</h2>
        </div>
        <div class="bg-blue-100 rounded-2xl h-32 flex flex-col items-center justify-center border-2 border-dashed border-toyBlue">
          <i class="fas fa-location-arrow text-toyBlue text-2xl animate-pulse"></i>
          <span class="text-xs font-bold text-toyBlue mt-2">正在前往目的地...</span>
        </div>
      </section>

      <section class="bg-white rounded-3xl p-4 shadow-sm border-l-8 border-toyPurple border-b-4 border-slate-200">
        <div class="flex items-center space-x-2 mb-3">
          <i class="fas fa-plane-departure text-toyPurple text-xl"></i>
          <h2 class="text-lg font-black text-slate-700">巴斯飛行任務</h2>
        </div>
        <div class="bg-purple-50 p-3 rounded-2xl border border-purple-100">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-black text-toyPurple">{{ flight.flightNo }}</span>
            <span class="text-[10px] bg-green-500 text-white px-2 py-0.5 rounded-full">ON TIME</span>
          </div>
          <div class="flex justify-between items-center">
            <div class="text-center font-black text-xl">{{ flight.from }}</div>
            <div class="flex-1 px-4 text-center">
              <div class="h-0.5 bg-purple-200 w-full relative">
                <i class="fas fa-plane text-toyPurple absolute -top-1.5 left-1/2"></i>
              </div>
            </div>
            <div class="text-center font-black text-xl">{{ flight.to }}</div>
          </div>
        </div>
      </section>

      <section class="bg-white rounded-3xl p-4 shadow-sm border-l-8 border-toyRed border-b-4 border-slate-200">
        <div class="flex justify-between items-center mb-3">
          <div class="flex items-center space-x-2">
            <i class="fas fa-piggy-bank text-toyRed text-xl"></i>
            <h2 class="text-lg font-black text-slate-700">火腿記帳本</h2>
          </div>
          <span class="text-xs font-black bg-red-100 text-toyRed px-2 py-1 rounded-lg">Total: ${{ totalExpense }}</span>
        </div>
        <div class="flex gap-2 mb-3">
          <input v-model="newExpense.title" placeholder="買咩?" class="flex-1 text-xs p-2 rounded-xl bg-slate-100 border-none focus:ring-2 focus:ring-toyRed outline-none">
          <input v-model.number="newExpense.amount" type="number" placeholder="$" class="w-16 text-xs p-2 rounded-xl bg-slate-100 border-none outline-none">
          <button @click="addExpense" class="bg-toyRed text-white px-4 rounded-xl text-xs font-black">加</button>
        </div>
        <div class="space-y-1">
          <div v-for="exp in expenses" class="flex justify-between text-xs p-2 bg-slate-50 rounded-lg">
            <span class="font-bold">{{ exp.title }}</span>
            <span class="font-black text-toyRed">${{ exp.amount }}</span>
          </div>
        </div>
      </section>

    </main>

    <nav class="absolute bottom-0 inset-x-0 bg-white/80 backdrop-blur-md border-t border-slate-200 h-20 flex justify-around items-center px-4">
      <div class="flex flex-col items-center text-toyBlue"><i class="fas fa-home"></i><span class="text-[10px] font-bold">主頁</span></div>
      <div class="flex flex-col items-center text-slate-300"><i class="fas fa-map"></i><span class="text-[10px] font-bold">地圖</span></div>
      <div class="w-14 h-14 bg-toyRed rounded-full -mt-10 border-4 border-white shadow-lg flex items-center justify-center text-white text-xl"><i class="fas fa-plus"></i></div>
      <div class="flex flex-col items-center text-slate-300"><i class="fas fa-suitcase"></i><span class="text-[10px] font-bold">行李</span></div>
      <div class="flex flex-col items-center text-slate-300"><i class="fas fa-user"></i><span class="text-[10px] font-bold">我的</span></div>
    </nav>
  </div>

  <script>
    const { createApp, ref, computed } = Vue
    createApp({
      setup() {
        const itinerary = ref([
          { time: '09:45', activity: '安菲爾德球場導賞團', loc: 'Liverpool' },
          { time: '13:00', activity: 'Belzan 餐廳', loc: '371 Smithdown Rd' }
        ])
        const flight = ref({ flightNo: 'BA8089', from: 'HKG', to: 'LPL' })
        const expenses = ref([{ title: '球員頸巾', amount: 30 }])
        const newExpense = ref({ title: '', amount: null })
        const totalExpense = computed(() => expenses.value.reduce((s, i) => s + i.amount, 0))
        const addExpense = () => {
          if(newExpense.value.title && newExpense.value.amount) {
            expenses.value.push({...newExpense.value})
            newExpense.value = { title: '', amount: null }
          }
        }
        return { itinerary, flight, expenses, newExpense, totalExpense, addExpense }
      }
    }).mount('#app')
  </script>
</body>
</html>﻿
