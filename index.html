<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Euro 2026 Adventure</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: { extend: { colors: { toyBlue: '#2A75B3', toyYellow: '#F1C40F', toyRed: '#E74C3C', toyGreen: '#2ECC71', toyPurple: '#9B59B6', toyWoody: '#F39C12' }}}
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer components {
      .app-container { height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
      .card-toy { 
        @apply bg-white rounded-[2.5rem] p-6 shadow-xl border-b-[8px] border-slate-200 overflow-y-auto relative; 
        height: calc(100svh - 140px); /* 大幅增加文字顯示空間 */
      }
      .nav-item { @apply flex flex-col items-center cursor-pointer transition-all duration-300 text-slate-300 min-w-[75px] py-4; }
      .nav-item.active { @apply text-toyBlue scale-110; }
    }
    body { background-color: #E0F2FE; background-image: radial-gradient(#fff 10%, transparent 10%); background-size: 30px 30px; margin: 0; padding: 0; overscroll-behavior: none; }
    [v-cloak] { display: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    
    /* Logo 居中與大小修正 */
    .logo-img { height: 85px !important; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3)); margin-top: -10px; }
    
    /* 底部導航隱藏動畫 */
    .nav-hidden { transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .nav-visible { transform: translateY(0); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>
<body class="touch-none">

  <div id="app" class="app-container" v-cloak>
    <header class="bg-toyBlue pt-10 pb-2 px-4 text-center shadow-lg border-b-[6px] border-toyYellow shrink-0 relative z-50">
      <div class="flex flex-col items-center justify-center">
        <img src="pixelframe-design_26fq9zkc-removebg-preview.png" alt="Euro 2026" class="logo-img object-contain">
        <p class="text-white text-[8px] font-black tracking-widest uppercase opacity-70 italic mt-1">Adventure is better shared.</p>
      </div>
      <div v-if="loading" class="absolute right-4 top-12"><div class="w-2 h-2 bg-toyGreen rounded-full animate-ping"></div></div>
    </header>

    <main class="swiper mySwiper flex-1 w-full pt-4">
      <div class="swiper-wrapper">
        
        <div class="swiper-slide px-4">
          <div class="card-toy border-l-[12px] border-toyYellow" @scroll="handleScroll">
            <div class="sticky top-0 bg-white z-20 pb-4 flex justify-between items-center">
              <h2 class="text-2xl font-black text-toyYellow uppercase">Plan</h2>
              <button @click="toggleEdit('itinerary')"><i :class="isEditing.itinerary ? 'fas fa-check-circle text-toyGreen text-2xl' : 'fas fa-edit text-slate-200 text-xl'"></i></button>
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar mb-4 py-2 flex-nowrap swiper-no-swiping border-b">
              <button v-for="date in availableDates" @click="currentDate = date" :class="currentDate === date ? 'date-btn-active' : 'date-btn-inactive'" class="px-4 py-2 rounded-xl font-black text-xs transition-all border-2 shrink-0">{{ date }}</button>
            </div>
            <div v-if="isEditing.itinerary" class="space-y-4">
              <div v-for="(item, idx) in travelData.itinerary[currentDate]" class="p-4 bg-slate-50 rounded-2xl relative border-2 border-dashed border-slate-100">
                <input v-model="item.time" class="w-full p-2 mb-2 border-2 rounded-xl font-bold bg-white" placeholder="09:00">
                <textarea v-model="item.activity" class="w-full p-2 border-2 rounded-xl font-bold bg-white" placeholder="Activity..."></textarea>
                <button @click="travelData.itinerary[currentDate].splice(idx, 1)" class="absolute top-2 right-2 text-toyRed">✕</button>
              </div>
              <button @click="addItem('itinerary')" class="w-full py-4 border-2 border-dashed border-toyYellow rounded-2xl text-toyWoody font-black">+ ADD PLAN</button>
            </div>
            <div v-else class="space-y-4 pb-20">
              <div v-for="item in sortedItinerary" class="flex gap-4 p-4 border-b border-slate-50 items-start">
                <span class="text-toyWoody font-black text-sm w-12">{{item.time}}</span>
                <p class="font-bold text-base text-slate-700 leading-relaxed">{{item.activity}}</p>
              </div>
            </div>
          </div>
        </div>

        <div class="swiper-slide px-4">
          <div class="card-toy border-l-[12px] border-toyRed" @scroll="handleScroll">
            <h2 class="text-2xl font-black text-toyRed uppercase mb-4">Tickets</h2>
            <div v-for="t in travelData.tickets" class="p-4 bg-red-50 rounded-3xl mb-4 border border-red-100 text-center">
              <p class="font-black text-toyRed mb-2">{{t.name}}</p>
              <i class="fas fa-qrcode text-5xl text-slate-800"></i>
            </div>
          </div>
        </div>

        <div class="swiper-slide px-4"><div class="card-toy border-l-[12px] border-toyPurple" @scroll="handleScroll"><h2 class="text-2xl font-black text-toyPurple uppercase">Flight</h2></div></div>
        <div class="swiper-slide px-4"><div class="card-toy border-l-[12px] border-toyGreen" @scroll="handleScroll"><h2 class="text-2xl font-black text-toyGreen uppercase">Hotel</h2></div></div>
        <div class="swiper-slide px-4"><div class="card-toy border-l-[12px] border-toyWoody" @scroll="handleScroll"><h2 class="text-2xl font-black text-toyWoody uppercase">Map</h2></div></div>
        <div class="swiper-slide px-4"><div class="card-toy border-l-[12px] border-toyBlue" @scroll="handleScroll"><h2 class="text-2xl font-black text-toyBlue uppercase">Pack</h2></div></div>
        <div class="swiper-slide px-4"><div class="card-toy border-l-[12px] border-toyPink" @scroll="handleScroll"><h2 class="text-2xl font-black text-toyPink uppercase">Budget</h2></div></div>

      </div>
    </main>

    <nav :class="showNav ? 'nav-visible' : 'nav-hidden'" 
         class="fixed bottom-0 left-0 right-0 bg-white flex overflow-x-auto no-scrollbar border-t shrink-0 z-[100] px-2 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]" 
         style="height: calc(85px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);">
      <div @click="goTo(0)" :class="{active: activeIdx === 0}" class="nav-item"><i class="fas fa-calendar-day text-xl"></i><span class="text-[9px] font-black mt-1">PLAN</span></div>
      <div @click="goTo(1)" :class="{active: activeIdx === 1}" class="nav-item"><i class="fas fa-ticket-alt text-xl"></i><span class="text-[9px] font-black mt-1">TICKETS</span></div>
      <div @click="goTo(2)" :class="{active: activeIdx === 2}" class="nav-item"><i class="fas fa-plane text-xl"></i><span class="text-[9px] font-black mt-1">FLIGHT</span></div>
      <div @click="goTo(3)" :class="{active: activeIdx === 3}" class="nav-item"><i class="fas fa-hotel text-xl"></i><span class="text-[9px] font-black mt-1">HOTEL</span></div>
      <div @click="goTo(4)" :class="{active: activeIdx === 4}" class="nav-item"><i class="fas fa-map-marked-alt text-xl"></i><span class="text-[9px] font-black mt-1">MAP</span></div>
      <div @click="goTo(5)" :class="{active: activeIdx === 5}" class="nav-item"><i class="fas fa-suitcase text-xl"></i><span class="text-[9px] font-black mt-1">PACK</span></div>
      <div @click="goTo(6)" :class="{active: activeIdx === 6}" class="nav-item"><i class="fas fa-piggy-bank text-xl"></i><span class="text-[9px] font-black mt-1">BUDGET</span></div>
    </nav>
  </div>

  <script>
    const { createApp, ref, onMounted, computed } = Vue;
    const firebaseConfig = { apiKey: "AIzaSyA9rkD3I-5PX7Gszl41SlPCYALIeil2mkA", authDomain: "toystorytravel.firebaseapp.com", projectId: "toystorytravel", databaseURL: "https://toystorytravel-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    createApp({
      setup() {
        const swiperRef = ref(null);
        const activeIdx = ref(0);
        const loading = ref(true);
        const showNav = ref(true);
        const lastScrollTop = ref(0);
        const currentDate = ref('5/21');
        const availableDates = ['5/21','5/22','5/23','5/24','5/25','5/26','5/27','5/28','5/29','5/30','5/31','6/1','6/2','6/3','6/4','6/5','6/6','6/7'];
        const isEditing = ref({ itinerary:false });
        const travelData = ref({ itinerary: {}, tickets: [], flights: [], hotels: [] });

        // 滾動隱藏選單邏輯
        const handleScroll = (e) => {
          const st = e.target.scrollTop;
          if (st > lastScrollTop.value && st > 50) {
            showNav.value = false; // 向下滑動，隱藏
          } else {
            showNav.value = true;  // 向上滑動，顯示
          }
          lastScrollTop.value = st <= 0 ? 0 : st;
        };

        const sortedItinerary = computed(() => (travelData.value.itinerary[currentDate.value] || []).slice().sort((a,b) => a.time.localeCompare(b.time)));

        const loadFirebase = () => {
          db.ref('travelData').on('value', (s) => {
            const d = s.val() || {};
            if(!d.itinerary) d.itinerary = {};
            availableDates.forEach(date => { if(!d.itinerary[date]) d.itinerary[date] = []; });
            travelData.value = d; loading.value = false;
          });
        };
        const saveToFirebase = () => { loading.value = true; db.ref('travelData').set(travelData.value).then(() => loading.value = false); };
        const toggleEdit = (p) => { isEditing.value[p] = !isEditing.value[p]; if(!isEditing.value[p]) saveToFirebase(); };
        const addItem = (t) => { if(t==='itinerary') travelData.value.itinerary[currentDate.value].push({time:'09:00', activity:''}); };
        
        // 修復跳轉功能
        const goTo = (idx) => { 
          if(swiperRef.value) {
            swiperRef.value.slideTo(idx); 
            activeIdx.value = idx;
          }
        };

        onMounted(() => {
          loadFirebase();
          swiperRef.value = new Swiper(".mySwiper", { 
            speed: 400,
            on: { slideChange: function() { activeIdx.value = this.activeIndex; } } 
          });
        });

        return { travelData, isEditing, activeIdx, goTo, toggleEdit, loading, currentDate, availableDates, addItem, sortedItinerary, showNav, handleScroll }
      }
    }).mount('#app')
  </script>
</body>
</html>
