<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Euro 2026 Adventure</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <style type="text/tailwindcss">
    @layer components {
      .app-container { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background-color: #E0F2FE; }
      
      /* 核心滾動容器 */
      .card-toy { 
        @apply bg-white rounded-[2.5rem] p-5 shadow-xl border-b-[8px] border-slate-200 relative mx-4; 
        height: calc(100dvh - 165px); /* 動態預留 Header 與 Nav 空間 */
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .nav-item { @apply flex flex-col items-center justify-center cursor-pointer text-slate-300 flex-1 py-2; }
      .nav-item.active { @apply text-toyBlue scale-110; }
      .nav-text { @apply text-[8px] font-black mt-1 uppercase tracking-tighter; }
    }

    /* Logo 置中優化 */
    .header-slim { height: 70px; @apply bg-toyBlue relative z-50 flex items-center justify-center border-b-4 border-toyYellow; }
    .logo-img { height: 100px; position: absolute; top: 50%; transform: translateY(-45%); z-index: 60; }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    [v-cloak] { display: none; }
  </style>
</head>
<body>

  <div id="app" class="app-container" v-cloak>
    <header class="header-slim">
      <img src="pixelframe-design_26fq9zkc-removebg-preview.png" alt="Euro 2026" class="logo-img object-contain">
    </header>

    <main class="swiper mySwiper flex-1 w-full pt-6">
      <div class="swiper-wrapper">
        
        <div class="swiper-slide">
          <div class="card-toy border-l-[12px] border-toyYellow">
            <h2 class="text-xl font-black text-toyYellow mb-4 uppercase">Plan</h2>
            <div class="space-y-4">
              <div v-for="i in 10" class="p-4 border-b border-slate-50 flex gap-4">
                <span class="text-toyWoody font-black text-xs">09:00</span>
                <p class="text-sm font-bold text-slate-600">這是一段測試文字，證明內容可以下拉滾動。更多行程內容...</p>
              </div>
            </div>
          </div>
        </div>

        <div class="swiper-slide">
          <div class="card-toy border-l-[12px] border-toyRed">
            <h2 class="text-xl font-black text-toyRed mb-4 uppercase">Tickets</h2>
            <div class="flex flex-col items-center justify-center h-48 bg-red-50 rounded-3xl border-2 border-dashed border-red-200">
              <i class="fas fa-ticket-alt text-4xl text-toyRed mb-2"></i>
              <p class="text-xs font-black text-toyRed">NO TICKETS ADDED</p>
            </div>
          </div>
        </div>

        <div class="swiper-slide">
          <div class="card-toy border-l-[12px] border-toyPurple">
            <h2 class="text-xl font-black text-toyPurple mb-4 uppercase">Flight</h2>
            <div class="p-4 bg-purple-50 rounded-2xl">
              <p class="text-sm font-bold text-toyPurple">Flight Data Section</p>
            </div>
          </div>
        </div>

      </div>
    </main>

    <nav class="bg-white flex border-t shrink-0 z-50 pb-[env(safe-area-inset-bottom)] h-[75px]">
      <div @click="goTo(0)" :class="{active: activeIdx === 0}" class="nav-item"><i class="fas fa-calendar-day"></i><span class="nav-text">Plan</span></div>
      <div @click="goTo(1)" :class="{active: activeIdx === 1}" class="nav-item"><i class="fas fa-ticket-alt"></i><span class="nav-text">Tickets</span></div>
      <div @click="goTo(2)" :class="{active: activeIdx === 2}" class="nav-item"><i class="fas fa-plane"></i><span class="nav-text">Flight</span></div>
      <div @click="goTo(3)" :class="{active: activeIdx === 3}" class="nav-item"><i class="fas fa-hotel"></i><span class="nav-text">Hotel</span></div>
      <div @click="goTo(4)" :class="{active: activeIdx === 4}" class="nav-item"><i class="fas fa-map-marked-alt"></i><span class="nav-text">Map</span></div>
      <div @click="goTo(5)" :class="{active: activeIdx === 5}" class="nav-item"><i class="fas fa-suitcase"></i><span class="nav-text">Pack</span></div>
      <div @click="goTo(6)" :class="{active: activeIdx === 6}" class="nav-item"><i class="fas fa-piggy-bank"></i><span class="nav-text">Budget</span></div>
    </nav>
  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
      setup() {
        const swiperRef = ref(null);
        const activeIdx = ref(0);

        const goTo = (idx) => {
          swiperRef.value.slideTo(idx);
          activeIdx.value = idx;
        };

        onMounted(() => {
          swiperRef.value = new Swiper(".mySwiper", { 
            speed: 400,
            allowTouchMove: true, // 允許滑動切換頁面
            on: {
              slideChange: function() {
                activeIdx.value = this.activeIndex;
              }
            }
          });
        });

        return { activeIdx, goTo }
      }
    }).mount('#app')
  </script>
</body>
</html>
