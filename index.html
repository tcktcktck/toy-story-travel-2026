<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toy Story Travel - Pro Edition</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            toyBlue: '#2A75B3', toyYellow: '#F1C40F', toyRed: '#E74C3C',
            toyGreen: '#2ECC71', toyPurple: '#9B59B6', toyWoody: '#F39C12',
            toyPink: '#FFB6C1'
          }
        }
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer components {
      .card-toy { @apply bg-white rounded-[2.5rem] p-5 shadow-xl border-b-[8px] border-slate-200 h-[calc(100vh-230px)] overflow-y-auto relative; }
      .nav-item { @apply flex flex-col items-center cursor-pointer transition-all duration-300 text-slate-400; }
      .nav-item.active { @apply text-toyBlue scale-110; }
      .date-btn { @apply px-4 py-2 rounded-2xl font-black text-xs transition-all whitespace-nowrap; }
      .date-btn-active { @apply bg-toyYellow text-white shadow-md scale-105; }
      .date-btn-inactive { @apply bg-slate-100 text-slate-400; }
    }
    body { background-color: #E0F2FE; background-image: radial-gradient(#fff 10%, transparent 10%); background-size: 30px 30px; }
  </style>
</head>
<body class="h-screen overflow-hidden">

  <div id="app" class="h-full flex flex-col">
    
    <header class="bg-toyBlue p-4 text-white text-center shadow-lg border-b-[6px] border-toyYellow shrink-0">
      <h1 class="text-xl font-black italic tracking-tighter">TOY STORY TRAVEL</h1>
    </header>

    <div class="swiper mySwiper flex-1 w-full pt-2">
      <div class="swiper-wrapper">
        
        <div class="swiper-slide px-4">
          <div class="card-toy border-l-[12px] border-toyYellow">
            
            <div class="sticky top-0 bg-white z-10 pb-4">
              <h2 class="text-xl font-black text-slate-700 mb-3 flex items-center gap-2">
                <i class="fas fa-calendar-alt text-toyYellow"></i> 行程日程
              </h2>
              <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                <button v-for="day in Object.keys(itineraryData)" 
                        :key="day"
                        @click="currentDay = day"
                        :class="currentDay === day ? 'date-btn-active' : 'date-btn-inactive'"
                        class="date-btn">
                  {{ day }}
                </button>
              </div>
            </div>

            <div class="space-y-4 pt-2">
              <div v-for="item in itineraryData[currentDay]" :key="item.time" class="flex gap-4 p-4 rounded-3xl bg-amber-50 border border-amber-100">
                <span class="bg-toyWoody text-white font-black px-3 py-1 rounded-full text-[10px] h-fit">{{item.time}}</span>
                <div>
                  <p class="font-bold text-slate-800 text-sm">{{item.activity}}</p>
                  <p class="text-[10px] text-slate-500 mt-1 font-bold italic"><i class="fas fa-location-dot text-toyRed mr-1"></i>{{item.loc}}</p>
                </div>
              </div>
              <div v-if="itineraryData[currentDay].length === 0" class="text-center py-10 text-slate-300">
                <i class="fas fa-bed text-4xl mb-2"></i>
                <p class="text-xs font-bold text-slate-400">今日係休息日...</p>
              </div>
            </div>
          </div>
        </div>

        <div class="swiper-slide px-4">
          <div class="card-toy border-l-[12px] border-toyBlue">
            <h2 class="text-xl font-black text-slate-700 mb-4"><i class="fas fa-map-marked-alt text-toyBlue"></i> 玩具地圖</h2>
            <div class="bg-blue-100 rounded-[2rem] h-full border-4 border-dashed border-toyBlue flex flex-col items-center justify-center text-toyBlue p-6">
               <i class="fas fa-compass text-6xl mb-4 animate-spin-slow"></i>
               <p class="font-black text-center">安仔嘅專屬導航系統</p>
            </div>
          </div>
        </div>

        <div class="swiper-slide px-4">
          <div class="card-toy border-l-[12px] border-toyPurple">
            <h2 class="text-xl font-black text-slate-700 mb-4"><i class="fas fa-rocket text-toyPurple"></i> 航班資訊</h2>
            <div class="bg-purple-50 p-6 rounded-[2rem] border border-purple-100">
              <p class="text-center font-black text-toyPurple mb-4">BUZZ AIRWAY</p>
              <div class="flex justify-between items-center px-2">
                <div class="text-center"><p class="text-3xl font-black">{{flight.from}}</p><p class="text-[10px] font-bold text-slate-400">HKG</p></div>
                <i class="fas fa-plane text-toyPurple text-2xl rotate-45 animate-pulse"></i>
                <div class="text-center"><p class="text-3xl font-black">{{flight.to}}</p><p class="text-[10px] font-bold text-slate-400">LPL</p></div>
              </div>
            </div>
          </div>
        </div>

        <div class="swiper-slide px-4">
          <div class="card-toy border-l-[12px] border-toyGreen">
            <h2 class="text-xl font-black text-slate-700 mb-4"><i class="fas fa-hotel text-toyGreen"></i> 住宿</h2>
            <div class="bg-green-50 p-6 rounded-[2rem] border border-green-100">
              <p class="text-xl font-black text-slate-800">{{hotel.name}}</p>
              <p class="text-xs text-slate-500 mt-2">{{hotel.address}}</p>
            </div>
          </div>
        </div>

        <div class="swiper-slide px-4">
          <div class="card-toy border-l-[12px] border-toyPink">
             <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-pink-500"><i class="fas fa-piggy-bank"></i> 火腿記帳</h2>
                <div class="bg-pink-100 text-pink-500 font-black px-4 py-1 rounded-full shadow-inner">${{totalExpense}}</div>
             </div>
             <div class="flex gap-2 mb-4">
                <input v-model="newExpense.title" placeholder="買左咩?" class="flex-1 p-3 rounded-2xl bg-pink-50 border-none outline-none font-bold text-slate-700 text-xs">
                <input v-model.number="newExpense.amount" type="number" placeholder="$" class="w-20 p-3 rounded-2xl bg-pink-50 border-none outline-none font-bold text-slate-700 text-xs">
                <button @click="addExpense" class="bg-pink-500 text-white px-4 rounded-2xl font-black text-xs">加</button>
             </div>
             <div class="space-y-2">
                <div v-for="exp in expenses" class="flex justify-between p-3 bg-white border border-pink-100 rounded-2xl text-xs">
                  <span class="font-bold text-slate-600">{{exp.title}}</span>
                  <span class="font-black text-pink-500">${{exp.amount}}</span>
                </div>
             </div>
          </div>
        </div>

      </div>
      <div class="swiper-pagination !bottom-2"></div>
    </div>

    <nav class="bg-white/95 backdrop-blur-md h-20 flex justify-around items-center px-4 border-t border-slate-100 shrink-0 pb-2">
      <div @click="goTo(0)" :class="{active: activeIdx === 0}" class="nav-item"><i class="fas fa-calendar-alt text-lg"></i><span class="text-[9px] font-black mt-1">行程</span></div>
      <div @click="goTo(1)" :class="{active: activeIdx === 1}" class="nav-item"><i class="fas fa-map-location-dot text-lg"></i><span class="text-[9px] font-black mt-1">地圖</span></div>
      
      <div class="w-12 h-12 bg-toyRed rounded-full -mt-8 border-4 border-white shadow-lg flex items-center justify-center text-white">
        <i class="fas fa-star text-sm"></i>
      </div>

      <div @click="goTo(2)" :class="{active: activeIdx === 2}" class="nav-item"><i class="fas fa-plane text-lg"></i><span class="text-[9px] font-black mt-1">航班</span></div>
      <div @click="goTo(4)" :class="{active: activeIdx === 4}" class="nav-item"><i class="fas fa-piggy-bank text-lg"></i><span class="text-[9px] font-black mt-1">記帳</span></div>
    </nav>

  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue
    createApp({
      setup() {
        const swiperRef = ref(null);
        const activeIdx = ref(0);
        const currentDay = ref('May 21');

        // --- 行程數據結構 (按日期分類) ---
        const itineraryData = ref({
          'May 21': [
            { time: '10:00', activity: '到達機場', loc: 'HKG T1' },
            { time: '14:30', activity: '酒店 Check-in', loc: 'Liverpool Central' }
          ],
          'May 22': [
            { time: '09:00', activity: '披頭四博物館', loc: 'Albert Dock' },
            { time: '19:00', activity: '晚餐：Local Pub', loc: 'City Center' }
          ],
          'May 23': [
            { time: '16:00', activity: '英超賽事', loc: 'Anfield Stadium' }
          ],
          'May 24': [] // 休息日例子
        });

        const flight = ref({ flightNo: 'BA8089', from: 'HKG', to: 'LPL' });
        const hotel = ref({ name: '抱抱龍主題酒店', address: '95 Buzz Avenue, Liverpool' });
        const expenses = ref([{ title: '預訂酒店', amount: 3000 }]);
        const newExpense = ref({ title: '', amount: null });

        const totalExpense = computed(() => expenses.value.reduce((s, i) => s + (i.amount || 0), 0));
        const addExpense = () => {
          if(newExpense.value.title && newExpense.value.amount) {
            expenses.value.push({...newExpense.value});
            newExpense.value = { title: '', amount: null };
          }
        };

        const goTo = (idx) => {
          swiperRef.value.slideTo(idx);
          activeIdx.value = idx;
        };

        onMounted(() => {
          swiperRef.value = new Swiper(".mySwiper", {
            pagination: { el: ".swiper-pagination", clickable: true },
            on: {
              slideChange: function() {
                activeIdx.value = this.activeIndex;
              }
            }
          });
        });

        return { itineraryData, currentDay, flight, hotel, expenses, newExpense, totalExpense, addExpense, activeIdx, goTo }
      }
    }).mount('#app')
  </script>
</body>
</html>
