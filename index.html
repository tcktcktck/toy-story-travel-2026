<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Euro 2026 Adventure</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: { extend: { colors: { toyBlue: '#2A75B3', toyYellow: '#F1C40F', toyRed: '#E74C3C', toyGreen: '#2ECC71', toyPurple: '#9B59B6', toyWoody: '#F39C12' }}}
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer components {
      .app-container { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
      /* 最大化內容空間：只留下 Header 和 Nav 的最少空間 */
      .card-toy { 
        @apply bg-white rounded-[2.5rem] p-5 shadow-xl border-b-[8px] border-slate-200 overflow-y-auto relative; 
        height: calc(100dvh - 170px); 
      }
      .nav-item { @apply flex flex-col items-center cursor-pointer transition-all duration-300 text-slate-300 min-w-[65px] py-2; }
      .nav-item.active { @apply text-toyBlue scale-110; }
      .edit-input { @apply w-full p-2 mb-2 border-2 border-dashed border-slate-200 rounded-xl outline-none text-sm font-bold bg-blue-50/50; }
      .date-btn { @apply px-4 py-1.5 rounded-xl font-black text-[10px] transition-all border-2 shrink-0; }
      .date-btn-active { @apply bg-toyYellow text-white border-toyYellow shadow-md; }
      .date-btn-inactive { @apply bg-white text-slate-400 border-slate-100; }
    }
    body { background-color: #E0F2FE; overscroll-behavior: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    
    /* Logo 懸浮特效：視覺很大，但不佔據 Header 空間 */
    .logo-float {
      height: 110px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -40%);
      z-index: 100;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
    }
    .header-slim { height: 70px; position: relative; }
  </style>
</head>
<body class="touch-none">

  <div id="app" class="app-container" v-cloak>
    <header class="bg-toyBlue border-b-[4px] border-toyYellow header-slim shrink-0">
      <img src="pixelframe-design_26fq9zkc-removebg-preview.png" alt="Euro 2026" class="logo-float object-contain">
      <div v-if="loading" class="absolute right-4 top-4"><div class="w-2 h-2 bg-toyGreen rounded-full animate-ping"></div></div>
    </header>

    <div class="swiper mySwiper flex-1 w-full pt-6">
      <div class="swiper-wrapper">
        
        <div class="swiper-slide px-4">
          <div class="card-toy border-l-[12px] border-toyYellow">
            <div class="sticky top-0 bg-white z-20 pb-2 flex justify-between items-center mb-1">
              <h2 class="text-xl font-black text-toyYellow uppercase">Plan</h2>
              <button @click="toggleEdit('itinerary')"><i :class="isEditing.itinerary ? 'fas fa-check-circle text-toyGreen text-2xl' : 'fas fa-edit text-slate-200 text-xl'"></i></button>
            </div>
            
            <div class="flex gap-2 overflow-x-auto no-scrollbar mb-4 py-1 flex-nowrap swiper-no-swiping border-b border-slate-50">
              <button v-for="date in availableDates" :key="date" @click="currentDate = date" :class="currentDate === date ? 'date-btn-active' : 'date-btn-inactive'" class="date-btn">{{ date }}</button>
            </div>

            <div v-if="isEditing.itinerary" class="space-y-3">
              <div v-for="(item, idx) in travelData.itinerary[currentDate]" :key="idx" class="p-3 bg-slate-50 rounded-xl relative border-2 border-dashed border-slate-100">
                <input v-model="item.time" class="edit-input w-24" placeholder="09:00">
                <textarea v-model="item.activity" class="edit-input text-xs" placeholder="What to do?"></textarea>
                <button @click="travelData.itinerary[currentDate].splice(idx, 1)" class="absolute top-2 right-2 text-toyRed">✕</button>
              </div>
              <button @click="addItem('itinerary')" class="w-full py-2 border-2 border-dashed border-toyYellow rounded-xl text-xs font-black text-toyWoody">+ ADD</button>
            </div>

            <div v-else class="space-y-1">
              <div v-for="item in sortedItinerary" :key="item.time" class="flex gap-4 p-4 border-b border-slate-50 items-start">
                <span class="text-toyWoody font-black text-xs w-12 pt-1">{{item.time}}</span>
                <p class="font-bold text-sm text-slate-700 leading-relaxed whitespace-pre-line">{{item.activity}}</p>
              </div>
            </div>
          </div>
        </div>

        <div class="swiper-slide px-4">
            <div class="card-toy border-l-[12px] border-toyRed">
                <div class="flex justify-between items-center mb-4 border-b pb-2"><h2 class="text-xl font-black text-toyRed uppercase">Tickets</h2><button @click="toggleEdit('tickets')"><i :class="isEditing.tickets ? 'fas fa-check-circle text-toyGreen text-2xl' : 'fas fa-edit text-slate-200 text-xl'"></i></button></div>
                <div v-for="(t, idx) in travelData.tickets" class="p-4 bg-red-50 rounded-3xl mb-4 border border-red-100 text-center">
                    <div v-if="isEditing.tickets"><input v-model="t.name" class="edit-input"><input v-model="t.url" class="edit-input"></div>
                    <div v-else><p class="font-black text-toyRed mb-2">{{t.name}}</p><i class="fas fa-qrcode text-4xl text-slate-800"></i></div>
                </div>
            </div>
        </div>

      </div>
    </div>

    <nav class="bg-white flex overflow-x-auto no-scrollbar border-t shrink-0 z-50 px-2 pb-[env(safe-area-inset-bottom)] swiper-no-swiping shadow-[0_-5px_15px_rgba(0,0,0,0.05)]" 
         style="height: calc(75px + env(safe-area-inset-bottom));">
      <div v-for="(nav, idx) in navs" :key="idx" @click="goTo(idx)" :class="{active: activeIdx === idx}" class="nav-item">
        <i :class="nav.icon" class="text-lg"></i>
        <span class="text-[8px] font-black mt-1 uppercase">{{nav.label}}</span>
      </div>
    </nav>
  </div>

  <script>
    const { createApp, ref, onMounted, computed } = Vue;
    const firebaseConfig = { apiKey: "AIzaSyA9rkD3I-5PX7Gszl41SlPCYALIeil2mkA", authDomain: "toystorytravel.firebaseapp.com", projectId: "toystorytravel", databaseURL: "https://toystorytravel-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    createApp({
      setup() {
        const swiperRef = ref(null);
        const activeIdx = ref(0);
        const loading = ref(true);
        const currentDate = ref('5/21');
        const availableDates = ['5/21','5/22','5/23','5/24','5/25','5/26','5/27','5/28','5/29','5/30','5/31','6/1','6/2','6/3','6/4','6/5','6/6','6/7'];
        const isEditing = ref({ itinerary:false, flight:false, hotel:false, tickets:false });
        const travelData = ref({ itinerary: {}, flights: [], hotels: [], tickets: [] });

        const navs = [
          { label: 'Plan', icon: 'fas fa-calendar-day' },
          { label: 'Tickets', icon: 'fas fa-ticket-alt' },
          { label: 'Flight', icon: 'fas fa-plane' },
          { label: 'Hotel', icon: 'fas fa-hotel' },
          { label: 'Map', icon: 'fas fa-map-marked-alt' },
          { label: 'Pack', icon: 'fas fa-suitcase' },
          { label: 'Budget', icon: 'fas fa-piggy-bank' }
        ];

        // 自動排序：Itinerary
        const sortedItinerary = computed(() => {
          const list = travelData.value.itinerary[currentDate.value] || [];
          return [...list].sort((a, b) => a.time.localeCompare(b.time));
        });

        const loadFirebase = () => {
          db.ref('travelData').on('value', (s) => {
            const d = s.val() || {};
            if(!d.itinerary) d.itinerary = {};
            availableDates.forEach(date => { if(!d.itinerary[date]) d.itinerary[date] = []; });
            travelData.value = d; loading.value = false;
          });
        };
        
        const saveToFirebase = () => {
          loading.value = true;
          db.ref('travelData').set(travelData.value).then(() => loading.value = false);
        };

        const toggleEdit = (p) => {
          isEditing.value[p] = !isEditing.value[p];
          if(!isEditing.value[p]) saveToFirebase();
        };

        const addItem = (t) => {
          if(t==='itinerary') travelData.value.itinerary[currentDate.value].push({time:'09:00', activity:''});
        };

        const goTo = (idx) => { swiperRef.value.slideTo(idx); activeIdx.value = idx; };

        onMounted(() => {
          loadFirebase();
          swiperRef.value = new Swiper(".mySwiper", { 
            noSwiping: true, 
            noSwipingClass: 'swiper-no-swiping',
            on: { slideChange: function() { activeIdx.value = this.activeIndex; } } 
          });
        });

        return { navs, travelData, isEditing, activeIdx, goTo, toggleEdit, loading, currentDate, availableDates, addItem, sortedItinerary }
      }
    }).mount('#app')
  </script>
</body>
</html>
