<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Euro 2026 | London & BCN Personal Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: { 
        extend: { 
          colors: { toyBlue: '#2A75B3', toyYellow: '#F1C40F', toyRed: '#E74C3C', toyGreen: '#2ECC71' },
          borderRadius: { 'toy': '2.5rem' }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    :root { --toy-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); }
    @layer components {
      .app-container { @apply h-dvh flex flex-col bg-slate-50 dark:bg-slate-900 transition-colors duration-500; }
      .card-toy { @apply bg-white dark:bg-slate-800 rounded-toy p-6 shadow-2xl flex flex-col h-[calc(100%-32px)] mx-4 mt-2 border-t-[10px] relative transition-transform duration-300; }
      .event-card { @apply bg-slate-50 dark:bg-slate-700/50 border border-slate-100 dark:border-slate-600 rounded-2xl p-4 mb-3 flex gap-4 hover:scale-[1.02] transition-transform; }
      .nav-item { @apply flex-shrink-0 w-[72px] flex flex-col items-center justify-center cursor-pointer transition-all duration-300 snap-center; }
      .nav-label { @apply text-[10px] font-black mt-1.5 uppercase tracking-tighter; }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
    [v-cloak] { display: none; }
  </style>
</head>
<body>

  <div id="app" class="app-container" v-cloak>
    <header class="bg-toyBlue dark:bg-slate-950 shrink-0 flex items-center justify-between px-6 border-b-4 border-toyYellow" style="height: 70px;">
      <div class="flex flex-col">
        <h1 class="text-white font-black italic uppercase text-xl leading-none">Euro 2026</h1>
        <span class="text-toyYellow text-[10px] font-bold tracking-widest uppercase">Travel Box</span>
      </div>
      <div v-if="loading" class="flex gap-1">
        <div class="w-1.5 h-1.5 bg-toyGreen rounded-full animate-bounce"></div>
        <div class="w-1.5 h-1.5 bg-toyGreen rounded-full animate-bounce [animation-delay:-0.15s]"></div>
      </div>
    </header>

    <main class="flex-1 overflow-hidden relative">
      <div class="swiper mySwiper h-full w-full">
        <div class="swiper-wrapper">
          
          <div v-for="(page, index) in navItems" :key="page.label" class="swiper-slide py-4">
            <div class="card-toy" :style="{ borderColor: page.color }">
              <div class="flex justify-between items-center mb-5">
                <h2 class="font-black italic text-3xl uppercase tracking-tighter" :style="{ color: page.color }">{{ page.label }}</h2>
                <button @click="toggleEdit(page.label)" class="w-10 h-10 bg-slate-100 dark:bg-slate-700 rounded-xl flex items-center justify-center transition-active active:scale-90">
                  <i :class="isEditing[page.label] ? 'fas fa-check text-toyGreen' : 'fas fa-pen text-slate-400'"></i>
                </button>
              </div>

              <div class="flex-1 overflow-y-auto no-scrollbar">
                <div v-if="page.label === 'Plan'" class="flex gap-2 overflow-x-auto no-scrollbar mb-5 py-1 snap-x swiper-no-swiping">
                  <button v-for="date in availableDates" :key="date" @click="currentDate = date" 
                    :class="currentDate === date ? 'bg-toyYellow text-white shadow-lg scale-105' : 'bg-slate-100 dark:bg-slate-700 text-slate-400'" 
                    class="px-5 py-2.5 rounded-2xl text-xs font-black shrink-0 transition-all snap-center">
                    {{date}}
                  </button>
                </div>

                <transition-group name="fade" tag="div">
                  <div v-for="(item, idx) in getSortedData(page.label)" :key="item.id || idx" class="event-card">
                    <div class="w-12 shrink-0 flex flex-col items-center">
                      <span class="text-[10px] font-black text-toyBlue dark:text-toyYellow">{{item.time}}</span>
                      <div class="w-0.5 h-full bg-slate-200 dark:bg-slate-600 my-1 rounded-full"></div>
                    </div>
                    <div class="flex-1">
                      <h3 class="font-black text-slate-800 dark:text-slate-100 text-[13px] uppercase italic">{{item.location}}</h3>
                      <div v-if="item.note" class="bg-white/50 dark:bg-slate-800/50 rounded-xl p-3 text-[11px] font-bold text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">
                        {{item.note}}
                      </div>
                    </div>
                  </div>
                </transition-group>

                <div v-if="isEditing[page.label]" class="mt-4 space-y-4">
                   <button @click="addItem(page.label)" class="w-full py-4 border-4 border-dashed rounded-3xl font-black text-xs uppercase" :style="{ color: page.color, borderColor: page.color }">+ Add New Mission</button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>

    <nav class="bg-white dark:bg-slate-950 flex border-t dark:border-slate-800 overflow-x-auto no-scrollbar snap-x shrink-0" style="height: 85px; padding-bottom: env(safe-area-inset-bottom);">
      <div v-for="(nav, idx) in navItems" :key="nav.label" @click="goTo(idx)" 
           class="nav-item" :class="activeIdx === idx ? 'opacity-100' : 'opacity-40'">
        <div :class="activeIdx === idx ? 'bg-slate-100 dark:bg-slate-800' : ''" class="w-12 h-12 rounded-2xl flex items-center justify-center transition-colors">
          <i :class="[nav.icon, activeIdx === idx ? 'text-toyBlue dark:text-toyYellow' : 'text-slate-400']" class="text-xl"></i>
        </div>
        <span class="nav-label" :class="activeIdx === idx ? 'text-slate-900 dark:text-white' : 'text-slate-400'">{{ nav.label }}</span>
      </div>
    </nav>
  </div>

  <script>
    const { createApp, ref, onMounted, nextTick } = Vue;
    
    // Security Note: In production, move these to environment variables.
    const firebaseConfig = { apiKey: "AIzaSyA9rkD3I-5PX7Gszl41SlPCYALIeil2mkA", authDomain: "toystorytravel.firebaseapp.com", databaseURL: "https://toystorytravel-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    createApp({
      setup() {
        const swiperInstance = ref(null);
        const activeIdx = ref(0);
        const loading = ref(true);
        const currentDate = ref('5/22');
        const isEditing = ref({});
        const availableDates = ['5/21','5/22','5/23','5/24','5/25','5/26','5/27','5/28','5/29','5/30','5/31','6/1','6/4','6/6'];
        
        const travelData = ref({
          Plan: {
            '5/21': [{ id: 1, time: '12:25', location: 'Heathrow LHR', note: 'Elizabeth Line 前往 Ilford (£15.50)' }],
            '5/22': [
              { id: 2, time: '14:00', location: 'Pixar Experience', note: 'Wembley Park' },
              { id: 3, time: '19:30', location: 'Osteria Angelina', note: 'Chef\'s Counter | Ref #3UACFL4EMUDE' }
            ],
            '5/23': [
              { id: 4, time: '11:07', location: 'Avanti Train', note: 'London ➔ Liverpool\nCoach D, Seat 37, 38' },
              { id: 5, time: '20:00', location: 'Belzan Dinner', note: 'Ref BQ9QLVH6' }
            ],
            '5/24': [
              { id: 6, time: '16:00', location: 'LFC vs Brentford', note: 'Anfield Stadium | Beat Lounge' }
            ],
            '5/26': [
              { id: 7, time: '13:30', location: 'Wes Anderson', note: 'Design Museum | DMOJ21KHJZSP5' },
              { id: 8, time: '20:00', location: 'OMA (Greek)', note: 'Borough Market 2F | Ref 4DPE6B3M7653' }
            ],
            '5/27': [
              { id: 9, time: '12:45', location: 'Inside Aardman', note: 'Young V&A (笑笑羊) | 3741138' },
              { id: 10, time: '20:00', location: 'The Wolseley', note: 'Monument | Ref CVBBM23B8VVU' }
            ],
            '5/28': [{ id: 11, time: '13:00', location: 'Flight to BCN', note: 'LGW-BCN (BA8089)' }],
            '5/29': [{ id: 12, time: '14:30', location: 'Sagrada Família', note: 'Passion Tower Climb' }]
          },
          Tickets: [{ id: 101, time: '£778', location: 'LFC Hospitality', note: 'HK$8,231.72' }],
          Hotel: [{ id: 201, time: 'Gracia', location: 'BCN Apartment', note: 'Carrer de Francisco Giner, 16' }],
          Budget: [{ id: 301, time: 'Total', location: 'Trip Fund', note: 'Calculated 100%' }],
          Food: [{ id: 401, time: 'Fine', location: 'Belzan', note: 'Liverpool Best' }],
          Traffic: [{ id: 501, time: 'Bus', location: 'Transport for London', note: 'Fare: £1.75' }],
          List: [{ id: 601, time: 'BRP', location: 'ID Documents', note: 'Essential' }]
        });

        const navItems = [
          { label: 'Plan', icon: 'fas fa-map-pin', color: '#F1C40F' },
          { label: 'Tickets', icon: 'fas fa-ticket-alt', color: '#E74C3C' },
          { label: 'Hotel', icon: 'fas fa-bed', color: '#2ECC71' },
          { label: 'Budget', icon: 'fas fa-piggy-bank', color: '#3498DB' },
          { label: 'Food', icon: 'fas fa-hamburger', color: '#FF8C00' },
          { label: 'Traffic', icon: 'fas fa-train', color: '#8E44AD' },
          { label: 'List', icon: 'fas fa-clipboard-check', color: '#16A085' }
        ];

        const getRawData = (label) => label === 'Plan' ? (travelData.value.Plan[currentDate.value] || []) : (travelData.value[label] || []);
        const getSortedData = (label) => [...getRawData(label)].sort((a, b) => (a.time || "").localeCompare(b.time || ""));
        
        const toggleEdit = async (label) => {
          if (isEditing.value[label]) {
            loading.value = true;
            await db.ref('universalData').set(JSON.parse(JSON.stringify(travelData.value)));
            isEditing.value[label] = false;
            loading.value = false;
          } else { isEditing.value[label] = true; }
        };

        const goTo = (idx) => swiperInstance.value.slideTo(idx);

        onMounted(() => {
          db.ref('universalData').on('value', (s) => { if(s.val()) travelData.value = s.val(); loading.value = false; });
          swiperInstance.value = new Swiper(".mySwiper", { 
            speed: 400, 
            resistanceRatio: 0.5,
            on: { slideChange: function() { activeIdx.value = this.activeIndex; } } 
          });
        });

        return { travelData, isEditing, activeIdx, goTo, toggleEdit, loading, currentDate, availableDates, navItems, getRawData, getSortedData }
      }
    }).mount('#app')
  </script>
</body>
</html>
