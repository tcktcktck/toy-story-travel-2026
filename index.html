<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Euro 2026 | Mission Control</title>

  <style>
    [v-cloak] { display: none !important; }
    .loading-screen { 
      position: fixed; inset: 0; background: #2A75B3; 
      z-index: 9999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: white;
      font-family: sans-serif; transition: opacity 0.4s ease;
    }
  </style>

  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: { 
        extend: { 
          fontFamily: { sans: ['"Cabinet Grotesk"', 'sans-serif'] },
          colors: { toyBlue: '#2A75B3', toyYellow: '#F1C40F', toyRed: '#E74C3C', toyGreen: '#2ECC71' },
          borderRadius: { 'toy': '2.5rem' },
          keyframes: { wiggle: { '0%, 100%': { transform: 'rotate(-3deg)' }, '50%': { transform: 'rotate(3deg)' } } },
          animation: { wiggle: 'wiggle 0.3s ease-in-out 2' }
        }
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer components {
      .app-container { @apply fixed inset-0 flex flex-col bg-slate-50 dark:bg-slate-900 overflow-hidden; }
      .card-toy { @apply bg-white dark:bg-slate-800 rounded-toy p-6 shadow-2xl flex flex-col h-[calc(100%-1rem)] mx-4 mt-2 border-t-[12px] relative transition-all duration-300; }
      .event-card { @apply bg-slate-50 dark:bg-slate-700/40 border border-slate-100 dark:border-slate-600 rounded-2xl p-4 mb-3 flex gap-4 active:scale-[0.96] transition-all; }
      .input-toy { @apply w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 text-sm font-bold mb-2 focus:ring-2 focus:ring-toyBlue focus:bg-slate-50 dark:focus:bg-slate-800 outline-none dark:text-white transition-colors; }
      .btn-icon { @apply w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg transition-all active:scale-90 disabled:opacity-50; }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .list-enter-active, .list-leave-active { transition: all 0.3s ease; }
    .list-enter-from, .list-leave-to { opacity: 0; transform: translateY(15px); }
  </style>
</head>
<body class="antialiased">

  <div id="init-loader" class="loading-screen">
    <i class="fas fa-circle-notch animate-spin text-4xl mb-4"></i>
    <p class="font-black italic uppercase tracking-widest text-[10px]">Syncing Mission Data...</p>
  </div>

  <div id="app" class="app-container" v-cloak>
    <header class="bg-toyBlue dark:bg-slate-950 shrink-0 flex items-center justify-center border-b-4 border-toyYellow z-50 shadow-xl relative" style="height: 75px;">
      <img src="https://raw.githubusercontent.com/tcktcktck/toy-story-travel-2026/62a27a1f7851da08609825d8539050f5defadb29/logo.png" 
           alt="Logo" @click="triggerLogoJoy"
           class="h-12 object-contain active:scale-95 transition-transform drop-shadow-lg"
           :class="{'animate-wiggle': isWiggling}"
           onerror="this.src='https://cdn-icons-png.flaticon.com/512/3063/3063822.png';">
    </header>

    <main class="flex-1 overflow-hidden relative">
      <div class="swiper mySwiper h-full" style="touch-action: pan-y;">
        <div class="swiper-wrapper">
          <div v-for="(page, pIdx) in navItems" :key="page.label" class="swiper-slide h-full py-4">
            <div class="card-toy" :style="{ borderTopColor: page.color }">
              <div class="flex justify-between items-center mb-6 shrink-0">
                <h2 class="font-black text-3xl uppercase tracking-tighter" :style="{ color: page.color }">{{ page.label }}</h2>
                <button @click="toggleEdit(page.label)"
                  :disabled="isSaving[page.label]"
                  :class="isEditing[page.label] ? 'bg-toyGreen text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-400'"
                  class="btn-icon">
                  <i :class="isSaving[page.label] ? 'fas fa-spinner fa-spin' : isEditing[page.label] ? 'fas fa-check' : 'fas fa-pen'"></i>
                </button>
              </div>

              <div class="flex-1 overflow-y-auto no-scrollbar">
                <div v-if="page.label === 'Plan'" class="flex gap-2 overflow-x-auto no-scrollbar mb-6 py-1 snap-x swiper-no-swiping" style="touch-action: pan-x;">
                  <button v-for="date in availableDates" :key="date" @click="currentDate = date"
                    :class="currentDate === date ? 'bg-toyYellow text-white shadow-lg' : 'bg-slate-100 dark:bg-slate-700 text-slate-400'"
                    class="px-5 py-3 rounded-2xl text-[13px] font-black shrink-0 snap-center uppercase">
                    {{date}}
                  </button>
                </div>

                <transition-group name="list" tag="div" class="pb-12">
                  <div v-if="getSortedData(page.label).length === 0 && !isEditing[page.label]"
                       :key="'empty-' + page.label"
                       class="flex flex-col items-center justify-center py-20 opacity-30">
                    <i class="fas fa-map-pin text-4xl mb-4" :style="{ color: page.color }"></i>
                    <p class="text-xs font-black uppercase tracking-widest">No Missions Logged</p>
                  </div>

                  <template v-if="isEditing[page.label]">
                    <div v-for="(item, idx) in getRawData(page.label)" :key="'edit-'+idx" class="bg-slate-100 dark:bg-slate-900 p-4 rounded-2xl mb-4 relative border border-slate-200 dark:border-slate-700">
                      <input v-model="item.time" class="input-toy" placeholder="TIME">
                      <input v-model="item.location" class="input-toy" placeholder="MISSION">
                      <textarea v-model="item.note" class="input-toy mb-0 text-xs" placeholder="NOTES" rows="2"></textarea>
                      <button @click="removeItem(page.label, idx)" class="absolute -top-2 -right-2 bg-toyRed text-white w-8 h-8 rounded-full border-2 border-white shadow-lg flex items-center justify-center">
                        <i class="fas fa-times text-xs"></i>
                      </button>
                    </div>
                    <button @click="addItem(page.label)" :key="'add-'+page.label" class="w-full py-4 border-2 border-dashed rounded-2xl font-black text-xs uppercase" :style="{ color: page.color, borderColor: page.color }">+ Add Mission</button>
                  </template>

                  <template v-else>
                    <div v-for="item in getSortedData(page.label)" :key="item.id" class="event-card">
                      <div class="w-14 shrink-0 flex flex-col items-center text-toyBlue dark:text-toyYellow">
                        <span class="text-[10px] font-black uppercase tracking-tighter">{{item.time}}</span>
                        <div class="w-1 h-full bg-slate-200 dark:bg-slate-600 my-2 rounded-full opacity-30"></div>
                      </div>
                      <div class="flex-1">
                        <h3 class="font-black text-slate-800 dark:text-slate-100 text-sm uppercase tracking-tight">{{item.location}}</h3>
                        <p v-if="item.note" class="bg-white/60 dark:bg-slate-800/60 rounded-xl p-3 text-[11px] font-bold text-slate-500 dark:text-slate-400 mt-2 border border-white/40">
                          {{item.note}}
                        </p>
                      </div>
                    </div>
                  </template>
                </transition-group>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <nav class="bg-white dark:bg-slate-950 flex border-t-2 border-slate-100 dark:border-slate-800 shrink-0 z-[100] relative"
         style="min-height: 85px; padding-bottom: env(safe-area-inset-bottom);">
      <div v-for="(nav, idx) in navItems" :key="nav.label" @click="goTo(idx)"
           class="flex-1 flex flex-col items-center justify-center cursor-pointer transition-all duration-200"
           :class="activeIdx === idx ? 'scale-110' : 'scale-90'">
        <i :class="nav.icon" class="text-lg mb-1" :style="{ color: nav.color, opacity: activeIdx === idx ? '1' : '0.4' }"></i>
        <span class="text-[9px] font-black uppercase tracking-tight text-center px-1"
              :style="{ color: nav.color, opacity: activeIdx === idx ? '1' : '0.4' }">{{ nav.label }}</span>
        <div v-if="activeIdx === idx" class="w-1 h-1 rounded-full mt-1" :style="{ backgroundColor: nav.color }"></div>
      </div>
    </nav>
  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;
    const FIREBASE_CONFIG = { apiKey: "AIzaSyA9rkD3I-5PX7Gszl41SlPCYALIeil2mkA", authDomain: "toystorytravel.firebaseapp.com", databaseURL: "https://toystorytravel-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();

    createApp({
      setup() {
        const swiperInstance = ref(null);
        const activeIdx = ref(0);
        const currentDate = ref('5/21');
        const isWiggling = ref(false);
        const isEditing = ref({});
        const isSaving = ref({});
        const availableDates = ['5/21','5/22','5/23','5/24','5/25','5/26','5/27','5/28','5/29','5/30','5/31','6/1','6/2','6/3','6/4','6/5','6/6','6/7'];
        const travelData = ref({ Plan: {}, Tickets: [], Hotel: [], Budget: [], Food: [], Traffic: [], List: [] });

        const navItems = [
          { label: 'Plan',    icon: 'fas fa-map-marked-alt', color: '#F1C40F' },
          { label: 'Tickets', icon: 'fas fa-ticket-alt',     color: '#E74C3C' },
          { label: 'Hotel',   icon: 'fas fa-hotel',          color: '#2ECC71' },
          { label: 'Budget',  icon: 'fas fa-piggy-bank',     color: '#3498DB' },
          { label: 'Food',    icon: 'fas fa-utensils',       color: '#FF8C00' },
          { label: 'Traffic', icon: 'fas fa-bus-alt',        color: '#8E44AD' },
          { label: 'List',    icon: 'fas fa-clipboard-list', color: '#16A085' }
        ];

        const getSafeKey = (k) => k.replace(/[/]/g, '-');

        const getRawData = (label) => {
          if (label === 'Plan') {
            if (!travelData.value.Plan) travelData.value.Plan = {};
            return travelData.value.Plan[getSafeKey(currentDate.value)] || [];
          }
          return travelData.value[label] || [];
        };

        const getSortedData = (label) => {
          const data = getRawData(label);
          if (label === 'Plan') return [...data].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
          return [...data];
        };

        const sanitizeForFirebase = (obj) => {
          if (!obj.Plan) obj.Plan = {};
          return JSON.parse(JSON.stringify(obj, (key, val) => (val === undefined || val === null) ? '' : val));
        };

        const toggleEdit = async (label) => {
          if (isEditing.value[label]) {
            if (isSaving.value[label]) return;
            isSaving.value[label] = true;
            try {
              const clean = sanitizeForFirebase(travelData.value);
              await db.ref('universalData').set(clean);
              isEditing.value[label] = false;
            } catch (e) {
              alert('Save failed: ' + e.message + ' Your changes are kept.');
            } finally {
              isSaving.value[label] = false;
            }
          } else {
            isEditing.value[label] = true;
          }
        };

        const addItem = (label) => {
          if (label === 'Plan') {
            if (!travelData.value.Plan) travelData.value.Plan = {};
            const key = getSafeKey(currentDate.value);
            if (!travelData.value.Plan[key]) travelData.value.Plan[key] = [];
          }
          getRawData(label).push({ id: Date.now(), time: '', location: '', note: '' });
        };

        const removeItem = (label, idx) => getRawData(label).splice(idx, 1);
        const goTo = (idx) => swiperInstance.value.slideTo(idx);
        const triggerLogoJoy = () => { isWiggling.value = true; setTimeout(() => isWiggling.value = false, 700); };

        onMounted(() => {
          const loaderTimeout = setTimeout(() => {
            const loader = document.getElementById('init-loader');
            if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 400); }
          }, 5000);

          db.ref('universalData').on('value', (s) => {
            clearTimeout(loaderTimeout);
            if (s.val()) {
              const raw = s.val();
              if (raw.Plan) {
                const newPlan = {};
                Object.keys(raw.Plan).forEach(k => {
                  const safeK = k.replace(/[/]/g, '-');
                  const val = raw.Plan[k];
                  newPlan[safeK] = Array.isArray(val) ? val : Object.values(val || {});
                });
                raw.Plan = newPlan;
              }
              ['Tickets','Hotel','Budget','Food','Traffic','List'].forEach(pg => {
                if (raw[pg] && !Array.isArray(raw[pg])) raw[pg] = Object.values(raw[pg]);
              });
              travelData.value = raw;
            }
            const loader = document.getElementById('init-loader');
            if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 400); }
          });

          swiperInstance.value = new Swiper(".mySwiper", {
            speed: 350,
            noSwiping: true,
            noSwipingClass: 'swiper-no-swiping',
            on: { slideChange: function() { activeIdx.value = this.activeIndex; } }
          });
        });

        return { travelData, isEditing, isSaving, activeIdx, goTo, toggleEdit, currentDate, availableDates, navItems, getSortedData, getRawData, addItem, removeItem, triggerLogoJoy, isWiggling }
      }
    }).mount('#app')
  </script>
</body>
</html>
